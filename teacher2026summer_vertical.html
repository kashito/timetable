<script>
window.SharedClassState=(()=>{
  const API='state_api.php'; let cache={},loadFailed=false;
  async function loadAll(){
    try{const r=await fetch(API+'?v='+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'出席読込失敗');cache=j.state||{};loadFailed=false;}
    catch(e){console.warn(e);loadFailed=true;}
    return cache;
  }
  function get(k){return cache[k]||{};}
  async function save(k,patch){
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({eventKey:k},patch))});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'save failed'); cache[k]=j.state||{}; window.LessonFixed?.stateSaved(k,cache[k]); return cache[k];
  }
  return {loadAll,get,save,get loadFailed(){return loadFailed;}};
})();
</script>


<script>
(function(){
  const nativeFetch = window.fetch.bind(window);

  function aoaSheet(rows, headers){
    const data=[headers].concat(rows.map(r=>headers.map(h=>r[h] ?? '')));
    return XLSX.utils.aoa_to_sheet(data);
  }

  window.fetch = async function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if(url.includes('schedule.xlsx')){
      try{
        const apiRes = await nativeFetch('data_api.php?v='+Date.now(), {cache:'no-store'});
        const api = await apiRes.json();
        if(api && api.ok && api.initialized){
          const scheduleHeaders=['日付','日区分','授業ID','クラス','種別','給与区分','担当講師','教室','時間番号','開始','終了','科目','備考'];
          const studentHeaders=['生徒名','クラス','優先度'];

          const wb=XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, aoaSheet(api.schedule||[], scheduleHeaders), '時間割データ');
          XLSX.utils.book_append_sheet(wb, aoaSheet(api.students||[], studentHeaders), '生徒マスタ');

          const arr=XLSX.write(wb,{bookType:'xlsx',type:'array'});
          return new Response(arr,{
            status:200,
            headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
          });
        }
      }catch(e){
        console.warn('WEB編集データ読込失敗。Excelへフォールバックします。',e);
      }
    }
    return nativeFetch(input,init);
  };
})();
</script>

<script>
(function(){
  let showPast=false;
  let nowTimer=null;

  function parseMD(text){
    const m=(text||'').match(/(\d{1,2})\/(\d{1,2})/);
    if(!m) return null;
    return new Date(2026, Number(m[1])-1, Number(m[2]));
  }

  function getDateGroups(){
    return Array.from(document.querySelectorAll('.date-cell')).map(dc=>{
      const d=parseMD(dc.textContent);
      if(!d) return null;
      const cells=[dc];
      let n=dc.nextElementSibling;
      for(let i=0;i<11 && n;i++,n=n.nextElementSibling) cells.push(n);
      return {date:d,cells};
    }).filter(Boolean);
  }

  function applyPastVisibility(){
    const today=new Date();
    today.setHours(0,0,0,0);
    getDateGroups().forEach(g=>{
      const minPast=new Date(today); minPast.setDate(minPast.getDate()-3); const hide=window.HistoryWindow?!HistoryWindow.includes(g.date.toLocaleDateString('sv-SE')):g.date<today&&(!showPast||g.date<minPast);
      g.cells.forEach(c=>c.classList.toggle('hidden-past-day',hide));
    });
  }

  function setupPastToggle(){
    if(document.getElementById('pastDayToggle')) return;
    const main=document.querySelector('main') || document.body;
    const wrap=document.createElement('div');
    wrap.className='past-toggle-wrap';
    wrap.innerHTML='<label class="past-toggle-label"><input id="pastDayToggle" type="checkbox"><span>3日前まで表示</span></label>';
    main.insertBefore(wrap, main.firstChild);
    wrap.querySelector('input').addEventListener('change',e=>{
      showPast=e.target.checked;
      applyPastVisibility();
      drawNowLine();
    });
  }

  function toMin(hm){
    const [h,m]=hm.split(':').map(Number);
    return h*60+m;
  }

  const slots=[
    ['13:30','14:10'],['14:20','15:00'],['15:10','15:50'],
    ['16:00','16:40'],['16:50','17:30'],['17:40','18:20'],
    ['18:30','19:10'],['19:20','20:00'],['20:10','20:50'],
    ['21:00','21:40'],['21:50','22:30']
  ];

  function drawNowLine(){
    // Local DOM only. No fetch/API call.
    document.querySelectorAll('.current-time-line').forEach(x=>x.remove());

    const now=new Date();
    const todayText=String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0');
    const dateCell=Array.from(document.querySelectorAll('.date-cell')).find(
      el=>(el.textContent||'').includes(todayText)
    );
    if(!dateCell || dateCell.classList.contains('hidden-past-day')) return;

    const cal=dateCell.closest('.calendar');
    if(!cal) return;

    const cur=now.getHours()*60+now.getMinutes();
    if(cur<toMin('13:30') || cur>toMin('22:30')) return;

    const cells=[];
    let n=dateCell.nextElementSibling;
    for(let i=0;i<11 && n;i++,n=n.nextElementSibling) cells.push(n);

    let x=null;
    for(let i=0;i<slots.length;i++){
      const s=toMin(slots[i][0]), e=toMin(slots[i][1]);
      if(cur>=s && cur<=e && cells[i]){
        x=cells[i].offsetLeft + cells[i].offsetWidth*((cur-s)/(e-s));
        break;
      }
      if(i<slots.length-1){
        const ns=toMin(slots[i+1][0]);
        if(cur>e && cur<ns && cells[i]){
          x=cells[i].offsetLeft + cells[i].offsetWidth;
          break;
        }
      }
    }
    if(x===null) return;

    const line=document.createElement('div');
    line.className='current-time-line';
    line.style.left=x+'px';
    line.style.top=dateCell.offsetTop+'px';
    line.style.height=dateCell.offsetHeight+'px';

    const label=document.createElement('span');
    label.className='current-time-label';
    label.textContent='現在 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    line.appendChild(label);
    cal.appendChild(line);
  }

  function initLocalClock(){
    setupPastToggle();
    applyPastVisibility();
    drawNowLine();

    if(nowTimer) clearInterval(nowTimer);
    nowTimer=setInterval(drawNowLine,15000);

    window.addEventListener('resize',drawNowLine,{passive:true});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>setTimeout(initLocalClock,800));
  }else{
    setTimeout(initLocalClock,800);
  }
window.applyPastVisibility=applyPastVisibility;window.drawNowLine=drawNowLine;document.addEventListener('history-window-change',()=>{applyPastVisibility();drawNowLine();});
})();
</script>


<script>
(function(){

  const norm=v=>String(v??'').trim();

  function makeAutoSeries(r){
    const subs=String(r['科目']||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).join('+');
    return [norm(r['クラス']),norm(r['種別']),norm(r['担当講師']),subs].filter(Boolean).join('|');
  }
  function occurrenceKey(r){
    const subs=String(r['科目']||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).join('+');
    return [normalizeDate(r['日付']),norm(r['時間番号']),norm(r['クラス']),norm(r['担当講師']),norm(r['種別']),subs].join('|');
  }
  function normalizeDate(v){
    if(typeof v==='number'){
      const p=XLSX.SSF.parse_date_code(v);
      return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:'';
    }
    const s=String(v||'').trim();
    const m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:s.slice(0,10);
  }
  
  async function loadClassMemo(cls){

    return {

      <section class="ops-sec">
        <h3>📆 次回以降の日程一覧</h3>
        <div class="next-schedule-list">
          ${seriesRows.map(r=>{
            const d=normalizeDate(r['日付']);

            const endMap={'①':'14:10','②':'15:00','③':'15:50','④':'16:40','⑤':'17:30','⑥':'18:20','⑦':'19:10','⑧':'20:00','⑨':'20:50','⑩':'21:40','⑪':'22:30'};
            const endTime=norm(r['終了'])||endMap[slot]||'23:59';
            const dt=new Date(d+'T'+endTime+':00');

            const nextSubs=String(r['科目']||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).join('+');

      try{
        const items=await StudentAttachments.list(key,true);
        list.innerHTML=items.length?items.map(a=>`<div class="student-file-item"><span>${a.sender==='student'?'📤':'📎'}</span><a href="${StudentAttachments.rawUrl(a)}">${a.sender==='student'?'<b>生徒から：</b>':'<b>先生から：</b>'}${esc(a.name)}${a.senderName?' <small>('+esc(a.senderName)+')</small>':''}</a><button type="button" class="student-file-delete" data-id="${esc(a.id)}">削除</button></div>`).join(''):'<small>添付ファイルはありません。</small>';
        list.querySelectorAll('.student-file-delete').forEach(btn=>{
          btn.onclick=async()=>{
            if(!confirm('この添付ファイルを削除しますか？')) return;
            btn.disabled=true;
            try{ await StudentAttachments.remove(key,btn.dataset.id); await renderStudentFiles(); await applyAttachmentIndicators(); }
            catch(e){ if(msg) msg.textContent='削除失敗：'+(e.message||e); }
          };
        });
      }catch(e){ if(msg) msg.textContent='添付読込失敗：'+(e.message||e); }
    }
    const fileInput=modal.querySelector('#studentFileInput');
    const fileUpload=modal.querySelector('#studentFileUpload');
    if(fileUpload && fileInput){
      fileUpload.onclick=async()=>{
        const files=[...fileInput.files];
        const msg=modal.querySelector('#studentFileMsg');
        if(!files.length){ if(msg) msg.textContent='ファイルを選択してください。'; return; }
        fileUpload.disabled=true; fileUpload.textContent='アップロード中…'; if(msg) msg.textContent='';
        try{
          for(const f of files) await StudentAttachments.upload(key,f,{sender:'teacher'});
          fileInput.value=''; if(msg) msg.textContent='✓ アップロードしました';
          await renderStudentFiles(); await applyAttachmentIndicators();
        }catch(e){ if(msg) msg.textContent='アップロード失敗：'+(e.message||e); }
        finally{ fileUpload.disabled=false; fileUpload.textContent='📎 ファイルを追加'; }
      };
    }
    renderStudentFiles();


    const memoSaveBtn=modal.querySelector('#teacherMemoSave');
    const memoMsg=modal.querySelector('#teacherMemoMsg');
    const memoInput=modal.querySelector('#teacherMemo');
    SharedNotes.mount(memoInput,cls);

    if(memoInput){
      memoInput.oninput=()=>{
        if(memoMsg){
          memoMsg.textContent='未保存の変更があります';
          memoMsg.classList.remove('memo-save-success');
        }
      };
    }

    if(memoSaveBtn){
      memoSaveBtn.onclick=async()=>{
        memoSaveBtn.disabled=true;
        memoSaveBtn.textContent='保存中…';
        if(memoMsg){
          memoMsg.textContent='保存中…';
          memoMsg.classList.remove('memo-save-success');
        }
        try{
          await saveClassMemo(cls,memoInput?.value||'');
          await SharedClassState.loadAll();
          if(typeof applyCommentIndicators==='function') await applyCommentIndicators();
          memoSaveBtn.textContent='✓ 保存済み';
          if(memoMsg){
            memoMsg.textContent='✓ 保存しました（同じクラスに共有済み）';
            memoMsg.classList.add('memo-save-success');
          }
        }catch(e){
          memoSaveBtn.textContent='保存失敗';
          if(memoMsg) memoMsg.textContent='保存失敗：'+(e.message||e);
        }finally{
          memoSaveBtn.disabled=false;
          setTimeout(()=>{
            if(memoSaveBtn.textContent==='✓ 保存済み') memoSaveBtn.textContent='共有メモを投稿';
          },2000);
        }
      };
    }

    
    const roomChangeSave=modal.querySelector('#roomChangeSave');
    if(roomChangeSave){
      roomChangeSave.onclick=async()=>{
        const msg=modal.querySelector('#roomChangeMsg');
        const room=modal.querySelector('#roomChangeSelect')?.value||'';

        roomChangeSave.disabled=true;
        roomChangeSave.textContent='保存中…';
        if(msg) msg.textContent='';

        try{
          const r=await fetch('room_override_api.php',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({key:key,room:room})
          });
          const j=await r.json();
          if(!r.ok||!j.ok) throw new Error(j.error||'教室変更の保存に失敗しました');

          if(window.RoomOverrides){
            await RoomOverrides.refresh();
          }

          roomChangeSave.textContent='✓ 保存済み';
          if(msg){
            msg.textContent='✓ 教室を変更しました';
            msg.classList.add('room-save-success');
          }

          setTimeout(()=>{
            roomChangeSave.textContent='教室を保存';
          },1800);

        }catch(e){
          roomChangeSave.textContent='保存失敗';
          if(msg) msg.textContent='保存失敗：'+(e.message||e);
        }finally{
          roomChangeSave.disabled=false;
        }
      };
    }

async function saveOpsAndClose(){
      const msg=modal.querySelector('#opsMsg');
      const confirmBox=document.getElementById('opsSaveConfirm');
      if(confirmBox) confirmBox.classList.add('hidden');
      try{
        if(detailLoadFailed)throw new Error('読込に失敗した項目があります。詳細を開き直してください。');
        if(msg) msg.textContent='保存中…';
        const attendance={};
        modal.querySelectorAll('.attSel').forEach(x=>{ if(x.value&&x.value!=='---'&&!(x.dataset.autoExempt==='true'&&x.value==='免除')) attendance[x.dataset.name]=x.value; });
        const saveKey=modal.dataset.currentKey||key;
        await SharedClassState.save(saveKey,{
          publicNote:modal.querySelector('#publicNote')?.value||'',
          ready:!!modal.querySelector('#readyCheck')?.checked,
          attendance,
          attendanceTouched:true
        });
        // 講師共有メモも通常の保存ボタンで保存する
        await saveClassMemo(modal.dataset.currentClass||cls, modal.querySelector('#teacherMemo')?.value||'');
        // この日・このコマ固有のカルテを別データとして保存する
        if(!lessonRecord._loadFailed) await saveLessonRecord({
          eventKey:saveKey,
          memo:modal.querySelector('#lessonRecordMemo')?.value||'',
          homework:modal.querySelector('#lessonHomework')?.value||'',
          date:cardDate,
          slot:cardSlot,
          className:modal.dataset.currentClass||cls,
          teacher:cardTeacher,
          room:modal.querySelector('#roomChangeSelect')?.value||cardRoom,
          subject:cardSubject
        });
        if(msg) msg.textContent='保存しました。';
        try{
          if(typeof applyReadyOnce==='function') await applyReadyOnce();
          else if(typeof applyReady==='function') await applyReady();
          if(typeof applyCommentIndicators==='function') await applyCommentIndicators();
        }catch(uiError){ console.warn('保存後の画面更新に失敗',uiError); }
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden','true');
        RecordingFeedback.showSaved([...modal.querySelectorAll('.attSel')].every(x=>x.value&&x.value!=='---'),modal.querySelector('#lessonRecordMemo')?.value,modal.querySelector('#lessonHomework')?.value);
        document.dispatchEvent(new Event('lesson-recording-saved'));
        return true;
      }catch(saveError){
        if(msg) msg.textContent='保存に失敗しました：'+(saveError.message||saveError);
        return false;
      }
    }

    function hideOpsWithoutSave(){
      RecordingFeedback.consumeLink();
      const confirmBox=document.getElementById('opsSaveConfirm');
      if(confirmBox) confirmBox.classList.add('hidden');
      modal.classList.add('hidden');
      modal.setAttribute('aria-hidden','true');
    }

    const opsFormState=()=>JSON.stringify([...modal.querySelectorAll('#opsBody textarea,#opsBody select,#opsBody input[type=checkbox]')].filter(e=>!e.closest('.shared-notes-list,.sc-inbox')).map(e=>[e.id||e.dataset.name,e.type==='checkbox'?e.checked:e.value]));
    let initialOpsFormState=opsFormState();
    function requestOpsClose(){
      if(SharedNotes.busy(memoInput)){memoMsg.textContent='共有メモを保存中です。完了後に閉じてください。';return;}
      if(opsFormState()===initialOpsFormState){hideOpsWithoutSave();return;}
      let box=document.getElementById('opsSaveConfirm');
      if(!box){
        box=document.createElement('div');
        box.id='opsSaveConfirm';
        box.className='ops-save-confirm hidden';
        box.innerHTML=`<div class="ops-save-confirm-box">
          <div class="ops-save-confirm-title">変更内容を保存して閉じますか？</div>
          <div class="ops-save-confirm-actions">
            <button id="opsConfirmYes" type="button">保存して閉じる</button>
            <button id="opsConfirmNo" type="button">保存せず閉じる</button>
          </div>
        </div>`;
        document.body.appendChild(box);
      }
      box.classList.remove('hidden');
      const yes=box.querySelector('#opsConfirmYes');
      const no=box.querySelector('#opsConfirmNo');
      yes.onclick=async e=>{
        e.preventDefault();e.stopPropagation();
        yes.disabled=true; no.disabled=true; yes.textContent='保存中…';
        const ok=await saveOpsAndClose();
        if(!ok){ box.classList.add('hidden'); }
        yes.disabled=false; no.disabled=false; yes.textContent='保存して閉じる';
      };
      no.onclick=e=>{ e.preventDefault();e.stopPropagation(); hideOpsWithoutSave(); };
    }

    const shortcuts=document.createElement('div');shortcuts.className='detail-shortcuts';shortcuts.innerHTML=`<a href="class_schedule.html?class=${encodeURIComponent(cls)}">この授業の全予定</a><a href="lesson_records.html?class=${encodeURIComponent(cls)}">カルテ一覧</a><button type="button" data-manage-class="${esc(cls)}">参加生徒</button>`;modal.querySelector('#opsBody').prepend(shortcuts);
    let footer=modal.querySelector('.ops-footer');if(!footer){footer=document.createElement('div');footer.className='ops-footer';modal.querySelector('.teacher-ops-panel').appendChild(footer);}footer.replaceChildren();const fixedSave=modal.querySelector('#opsSave');if(fixedSave)footer.appendChild(fixedSave);const fixedMsg=modal.querySelector('#opsMsg');if(fixedMsg)footer.appendChild(fixedMsg);
    if(detailLoadFailed){modal.querySelector('#opsMsg').textContent='読込失敗：データ保護のため保存できません。詳細を開き直してください。';for(const id of ['teacherMemoSave','lessonRecordSave']){const button=modal.querySelector('#'+id);if(button)button.disabled=true;}}
    if(window.LessonFixed)LessonFixed.editor(key,modal.querySelector('.ops-summary'));
    const saveBtn=modal.querySelector('#opsSave');
    if(saveBtn) saveBtn.onclick=async e=>{ e.preventDefault();e.stopPropagation(); await saveOpsAndClose(); };
    const closeBtn=modal.querySelector('#opsClose');
    if(closeBtn) closeBtn.onclick=e=>{ e.preventDefault();e.stopPropagation(); requestOpsClose(); };
    modal.onclick=e=>{if(e.target.closest('[data-back-notices]')&&opsFormState()!==initialOpsFormState&&!confirm('未保存の変更があります。保存せずお知らせに戻りますか？')){e.preventDefault();return;} if(e.target===modal){ e.preventDefault(); requestOpsClose(); } };
  }

  function bind(){
    if(document.documentElement.dataset.teacherOpsDelegated==='1') return;
    document.documentElement.dataset.teacherOpsDelegated='1';
    window.openTeacherOpsKey=key=>{if(!key||window.__openedKarteKey===key)return;const card=[...document.querySelectorAll('.teacher-mobile-day .event[data-key],.event[data-key]')].find(c=>c.dataset.key===key);if(!card)return;window.__openedKarteKey=key;openOps(card);};
    setTimeout(()=>window.openTeacherOpsKey(new URLSearchParams(location.search).get('openKey')),0);


    // 絞り込みで時間割DOMが再生成されても、新しいカードをそのままクリック可能にする
    document.addEventListener('click',e=>{
      const card=e.target.closest('.event[data-key]');
      if(!card||e.target.closest('[data-lesson-action]')) return;
      e.preventDefault();
      e.stopPropagation();
      openOps(card);
    },true);
  }

  function reapplyTeacherUiAfterRender(){
    // app.js の render() がカード/日付DOMを作り直した後に再適用
    setTimeout(()=>{
      try{ applyPastVisibility(); }catch(e){}
      try{ drawNowLine(); }catch(e){}
      try{ applyReadyOnce(); }catch(e){}
    },0);
  }

  bind();
  window.addEventListener('load',()=>{
    setTimeout(()=>{bind();applyReadyOnce();applyPastVisibility();drawNowLine()},1000);
  });

  // 絞り込み・表示切替後も「過去日非表示」を維持
  ['classFilter','teacherFilter','roomFilter','typeFilter','subjectFilter','viewSelect'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener('change',reapplyTeacherUiAfterRender);
  });
  const clearBtn=document.getElementById('clearFilters');
  if(clearBtn) clearBtn.addEventListener('click',reapplyTeacherUiAfterRender);
})();
</script>

<script id="teacherMobilePersonalLayoutScript">
(function(){
  'use strict';
  const qs=new URLSearchParams(location.search);
  const presetTeacher=(qs.get('teacher')||'').trim();
  const pad=n=>String(n).padStart(2,'0');
  const toMin=hm=>{const m=String(hm||'').match(/^(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null};
  const fmtDate=d=>{
    const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return String(d||'');
    const wd=['日','月','火','水','木','金','土'][new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12).getDay()];
    return `${Number(m[2])}/${Number(m[3])}（${wd}）`;
  };
  const esc2=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  let teacherNgEntries=[];
  let teacherNgLoaded=false;
  async function loadTeacherNg(){
    try{
      const r=await fetch('teacher_ng_api.php?_='+Date.now(),{cache:'no-store'});
      const j=await r.json();
      teacherNgEntries=(j&&j.ok&&Array.isArray(j.entries))?j.entries:[];
    }catch(e){ teacherNgEntries=[]; }
    teacherNgLoaded=true;
  }
  function ngForDate(date){
    if(!presetTeacher) return null;
    return teacherNgEntries.find(e=>String(e&&e.teacher||'').trim()===presetTeacher && String(e&&e.date||'').slice(0,10)===date) || null;
  }
  function ngHtml(date){
    const ng=ngForDate(date);
    if(!ng) return '';
    const cond=ng.allDay ? '終日NG' : ((Array.isArray(ng.slots)&&ng.slots.length)?('NGコマ：'+ng.slots.join('・')):'NG');
    const note=String(ng.note||'').trim();
    return `<div class="teacher-mobile-ng">⚠ ${esc2(cond)}${note?`<span class="ng-note">条件：${esc2(note)}</span>`:''}</div>`;
  }

  function updateTeacherHeading(){
    if(!presetTeacher) return;
    const h=document.querySelector('.topbar h1');
    if(!h || h.querySelector('.teacher-mobile-teacher-name')) return;
    const s=document.createElement('span');
    s.className='teacher-mobile-teacher-name';
    s.textContent=presetTeacher+'先生のスケジュール';
    h.appendChild(s);
  }

  function visibleLessonRows(){
    try{
      return rows.filter(r=>!r.dayType && filterMatch(r)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
    }catch(e){return []}
  }

  function specialForDate(d){
    try{return rows.find(r=>r.date===d && r.dayType)}catch(e){return null}
  }

  function addCardFlags(card,r){
    const now=new Date();
    const sm=toMin(r.start), em=toMin(r.end);
    if(sm===null || em===null) return;
    const dm=String(r.date||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!dm) return;
    const start=new Date(Number(dm[1]),Number(dm[2])-1,Number(dm[3]),Math.floor(sm/60),sm%60);
    const end=new Date(Number(dm[1]),Number(dm[2])-1,Number(dm[3]),Math.floor(em/60),em%60);
    if(now>=start && now<end) card.classList.add('teacher-mobile-current');
  }

  function markNext(){
    const cards=[...document.querySelectorAll('.teacher-mobile-day .event[data-date][data-slot]')];
    const now=Date.now();
    let best=null,bestTs=Infinity;
    cards.forEach(c=>{
      if(c.classList.contains('teacher-mobile-current')) return;
      const date=c.dataset.date;
      const meta=c.querySelector('.event-meta')?.textContent||'';
      const tm=meta.match(/(\d{1,2}:\d{2})-(\d{1,2}:\d{2})/);
      if(!tm) return;
      const m=date.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return;
      const mins=toMin(tm[1]);
      const ts=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),Math.floor(mins/60),mins%60).getTime();
      if(ts>now && ts<bestTs){best=c;bestTs=ts}
    });
    if(best) best.classList.add('teacher-mobile-next');
  }

  function renderTeacherMobile(){
    const host=document.getElementById('schedule');
    if(!host) return;
    const lessons=LinkedSchedule.merge(visibleLessonRows());
    // 授業データが存在しない日も抜け落ちないよう、日付を連続生成する。
    // 授業がない日も、調整中・未定・休講日の案内を表示する。
    const dateSet=new Set();
    try{ rows.forEach(r=>{ if(r && r.date) dateSet.add(r.date); }); }catch(e){}
    const actualDates=[...dateSet].filter(Boolean).sort();
    const parseDate=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])):null};
    const keyDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const today=new Date(); today.setHours(0,0,0,0);
    let first=actualDates.length?parseDate(actualDates[0]):new Date(today);
    if(!first) first=new Date(today);
    let end=new Date(today); end.setDate(end.getDate()+120);
    if(actualDates.length){const last=parseDate(actualDates[actualDates.length-1]); if(last&&last>end)end=last;}
    const dates=[];
    for(let d=new Date(first); d<=end; d.setDate(d.getDate()+1)) dates.push(keyDate(d));
    let html='';

    dates.forEach(d=>{
      const dayLessons=lessons.filter(r=>r.date===d);
      const special=specialForDate(d);
      const first=dayLessons[0], last=dayLessons.reduce((last,r)=>toMin(r.end)>toMin(last.end)?r:last,dayLessons[0]);
      const inTime=(()=>{
        if(!dayLessons.length || !first.start) return '';
        const m=toMin(first.start);
        if(m===null) return '';
        const x=Math.max(0,m-10);
        return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
      })();
      const summary=dayLessons.length?`${inTime}IN　${first.start||''}-${last.end||''}`:'';
      const schoolHoliday=!!(window.SchoolHolidays&&SchoolHolidays.isHoliday(d));
      html+=`<section class="teacher-mobile-day${schoolHoliday?' is-school-holiday':''}" data-mobile-date="${esc2(d)}"><div class="teacher-mobile-day-title"><span>${esc2(fmtDate(d))}${schoolHoliday?'<b class="school-holiday-label">休講日</b>':''}</span><small>${esc2(summary)}</small></div><div class="ce-day-events" data-calendar-date="${esc2(d)}"></div>`;
      html+=ngHtml(d);
      if(special){
        html+=`<div class="teacher-mobile-special">${esc2(displayDayType(special.dayType,d))}${special.note?`<div style="font-size:12px;font-weight:600;margin-top:4px">${esc2(special.note)}</div>`:''}</div>`;
      } else if(!dayLessons.length && !(ngForDate(d)&&ngForDate(d).allDay)){
        html+=`<div class="teacher-mobile-special">${esc2(SchoolHolidays.emptyDayLabel(d))}</div>`;
      }
      let prevEnd=null;
      dayLessons.forEach(r=>{
        const st=toMin(r.start), en=toMin(r.end);
        if(prevEnd!==null && st!==null && st>prevEnd){
          html+=`<div class="teacher-mobile-gap">空き ${st-prevEnd}分</div>`;
        }
        let card=eventHTML(r);
        card=card.replace('<div class="event-title">',`<div class="teacher-mobile-time">${esc2(r.start||'')}–${esc2(r.end||'')}</div><div class="event-title">`);
        html+=card;
        if(en!==null) prevEnd=Math.max(prevEnd??0,en);
      });
      html+='</section>';
    });

    if(!html) html='<div class="teacher-mobile-empty">該当する授業はありません。</div>';
    host.innerHTML=html;
    try{bindEvents()}catch(e){}
    document.querySelectorAll('.teacher-mobile-day .event[data-date]').forEach(c=>{
      const r=lessons.find(x=>x.date===c.dataset.date && x.slot===c.dataset.slot && x.cls===c.dataset.class);
      if(r) addCardFlags(c,{...r,start:c.dataset.start||r.start,end:c.dataset.end||r.end});
    });
    markNext();
    try{ if(typeof applyReadyOnce==='function') applyReadyOnce(); }catch(e){}
    try{ if(typeof applyPastVisibility==='function') applyPastVisibility(); }catch(e){}
    try{const ok=new URLSearchParams(location.search).get('openKey');if(ok&&!window.__openedKarteKey)setTimeout(()=>window.openTeacherOpsKey?.(ok),120);}catch(e){}
  }

  async function install(){
    updateTeacherHeading();
    if(!teacherNgLoaded) await loadTeacherNg();
    const oldRender=typeof render==='function'?render:null;
    if(!oldRender) return setTimeout(install,200);
    if(window.__teacherMobileRenderInstalled) return;
    window.__teacherMobileRenderInstalled=true;

    render=function(){
      const filteredCount=rows.filter(r=>!r.dayType&&filterMatch(r)).length;
      const total=rows.filter(r=>!r.dayType).length;
      renderTeacherMobile();
      const sb=document.getElementById('statusBar');
      if(sb) sb.textContent=`授業 ${filteredCount}件を表示中（全${total}件）`;
    };
    renderTeacherMobile();

    ['classFilter','teacherFilter','roomFilter','typeFilter','subjectFilter','viewSelect'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.addEventListener('change',()=>setTimeout(renderTeacherMobile,0));
    });
    const clear=document.getElementById('clearFilters');
    if(clear) clear.addEventListener('click',()=>setTimeout(renderTeacherMobile,0));

    setInterval(()=>{
      document.querySelectorAll('.teacher-mobile-next,.teacher-mobile-current').forEach(x=>x.classList.remove('teacher-mobile-next','teacher-mobile-current'));
      const currentLessons=visibleLessonRows();
      document.querySelectorAll('.teacher-mobile-day .event[data-date]').forEach(c=>{
        const r=currentLessons.find(x=>x.date===c.dataset.date && x.slot===c.dataset.slot && x.cls===c.dataset.class);
        if(r) addCardFlags(c,{...r,start:c.dataset.start||r.start,end:c.dataset.end||r.end});
      });
      markNext();
    },30000);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(install,500));
  else setTimeout(install,500);
  window.addEventListener('load',()=>setTimeout(async()=>{updateTeacherHeading();await loadTeacherNg();renderTeacherMobile()},1400));
})();
</script>


<script id="teacher-mobile-past-real-fix-v1">
(function(){
  'use strict';

  const pad=n=>String(n).padStart(2,'0');

  function todayKey(){
    const d=new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function getToggle(){
    return document.getElementById('pastDayToggle') ||
      document.querySelector('input[type="checkbox"][id*="past" i],input[type="checkbox"][name*="past" i],input[type="checkbox"][id*="ended" i],input[type="checkbox"][name*="ended" i]');
  }

  function apply(){
    const cb=getToggle();
    const showPast=cb ? cb.checked : false;
    const today=todayKey();

    // ACTUAL smartphone vertical layout uses data-mobile-date.
    document.querySelectorAll('.teacher-mobile-day[data-mobile-date]').forEach(day=>{
      const d=(day.getAttribute('data-mobile-date')||'').trim();
      const minPast=(()=>{const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-3);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`})(); day.style.display=(window.HistoryWindow?!HistoryWindow.includes(d):(d&&d<today&&(!showPast||d<minPast))) ? 'none' : '';
    });
  }

  function initialize(){
    const cb=getToggle();
    if(cb && !cb.dataset.pastRealFixBound){
      // Requirement: default is ALWAYS hidden on a new page load.
      cb.checked=false;
      cb.dataset.pastRealFixBound='1';
      cb.addEventListener('change',apply);
    }
    apply();
  }

  // Apply after every possible delayed render.
  document.addEventListener('DOMContentLoaded',()=>{
    initialize();
    setTimeout(initialize,300);
    setTimeout(initialize,800);
    setTimeout(initialize,1600);
  });
  window.addEventListener('load',()=>{
    initialize();
    setTimeout(initialize,500);
    setTimeout(initialize,1500);
  });

  // Mobile schedule is rebuilt with innerHTML; re-apply whenever that happens.
  const startObserver=()=>{
    const host=document.getElementById('schedule');
    if(!host) return setTimeout(startObserver,100);
    const obs=new MutationObserver(()=>{
      clearTimeout(window.__teacherMobilePastRealTimer);
      window.__teacherMobilePastRealTimer=setTimeout(apply,20);
    });
    obs.observe(host,{childList:true,subtree:true});
  };
  startObserver();
})();
</script>


<script id="teacher-vertical-off-fix-v1">
(function(){
  'use strict';
  const pad=n=>String(n).padStart(2,'0');
  const todayKey=()=>{
    const d=new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  };
  function ensureOffDays(){
    const days=[...document.querySelectorAll('.teacher-mobile-day[data-mobile-date]')];
    if(!days.length) return;

    const today=todayKey();
    const cb=document.getElementById('pastDayToggle') ||
      document.querySelector('input[type="checkbox"][id*="past" i],input[type="checkbox"][name*="past" i],input[type="checkbox"][id*="ended" i],input[type="checkbox"][name*="ended" i]');
    const showPast=!!(cb && cb.checked);

    days.forEach(day=>{
      const date=(day.getAttribute('data-mobile-date')||'').trim();
      if(!date) return;

      const md=new Date();md.setHours(0,0,0,0);md.setDate(md.getDate()-3);const minPast=`${md.getFullYear()}-${pad(md.getMonth()+1)}-${pad(md.getDate())}`;
      if(window.HistoryWindow?!HistoryWindow.includes(date):date<today&&(!showPast||date<minPast)){ day.style.display='none'; return; }

      const hasCard=!!day.querySelector('.teacher-mobile-card,.lesson-card,.schedule-card,[data-start][data-end]');
      const hasTime=/\d{1,2}:\d{2}\s*[〜~\-–]\s*\d{1,2}:\d{2}/.test(day.textContent||'');
      // renderTeacherMobile() がすでに OFF / 休講等を表示している日は重複OFFを追加しない。
      const hasSpecial=!!day.querySelector('.teacher-mobile-special');
      const duplicateOff=day.querySelector('.teacher-mobile-off');
      if(hasSpecial && duplicateOff) duplicateOff.remove();
      const hasAllDayNg=/終日NG/.test(day.textContent||'');
      if(!hasCard && !hasTime && !hasSpecial && !hasAllDayNg){
        let off=day.querySelector('.teacher-mobile-off');
        if(!off){
          off=document.createElement('div');
          off.className='teacher-mobile-off';
          off.textContent=SchoolHolidays.emptyDayLabel(date);
          off.style.cssText='margin:5px 3px 8px;padding:2px 0;border:0;background:transparent;font-weight:700;color:#b8bec7;';
          day.appendChild(off);
        }
      }
    });
  }

  function kick(){
    ensureOffDays();
    setTimeout(ensureOffDays,300);
    setTimeout(ensureOffDays,800);
  }

  document.addEventListener('DOMContentLoaded',kick);
  window.addEventListener('load',kick);

  const waitHost=()=>{
    const host=document.getElementById('schedule');
    if(!host) return setTimeout(waitHost,100);
    const obs=new MutationObserver(()=>{
      clearTimeout(window.__teacherOffTimer);
      window.__teacherOffTimer=setTimeout(ensureOffDays,50);
    });
    obs.observe(host,{childList:true,subtree:true});
  };
  waitHost();
})();
</script>


<script id="teacher-vertical-horizontal-nowline-v2">
(function(){
  'use strict';

  const pad=n=>String(n).padStart(2,'0');

  function todayKey(){
    const d=new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function toMin(v){
    const m=String(v||'').match(/(\d{1,2}):(\d{2})/);
    return m ? (+m[1])*60+(+m[2]) : null;
  }

  function cardTimes(card){
    let start=card.getAttribute('data-start')||card.dataset.start||'';
    let end=card.getAttribute('data-end')||card.dataset.end||'';

    if(!start || !end){
      const text=card.textContent||'';
      const m=text.match(/(\d{1,2}:\d{2})\s*[〜~\-–]\s*(\d{1,2}:\d{2})/);
      if(m){ start=m[1]; end=m[2]; }
    }
    return [toMin(start),toMin(end)];
  }

  function clearLines(){
    document.querySelectorAll('.teacher-v-nowline,.teacher-v-nowline-label').forEach(el=>el.remove());
  }

  function draw(){
    clearLines();

    const now=new Date();
    const nowMin=now.getHours()*60+now.getMinutes();
    const day=document.querySelector(`.teacher-mobile-day[data-mobile-date="${todayKey()}"]`);
    if(!day) return;

    // 実際の縦レイアウトカードは .event
    const cards=[...day.querySelectorAll('.event[data-date],.event-card[data-date]')];

    for(const card of cards){
      const [start,end]=cardTimes(card);
      if(start==null || end==null) continue;

      if(nowMin>=start && nowMin<=end){
        if(getComputedStyle(card).position==='static') card.style.position='relative';

        const ratio=(nowMin-start)/Math.max(1,end-start);
        const top=Math.max(0,Math.min(100,ratio*100));

        const line=document.createElement('div');
        line.className='teacher-v-nowline';
        line.style.top=top+'%';

        const label=document.createElement('div');
        label.className='teacher-v-nowline-label';
        label.style.top=top+'%';
        label.textContent=`現在 ${pad(now.getHours())}:${pad(now.getMinutes())}`;

        card.appendChild(line);
        card.appendChild(label);
        return;
      }
    }

    // 授業間の空き時間は、該当する「空き○分」ブロックの位置へ横線を表示
    const ordered=cards.map(card=>{
      const [start,end]=cardTimes(card);
      return {card,start,end};
    }).filter(x=>x.start!=null&&x.end!=null).sort((a,b)=>a.start-b.start);

    for(let i=0;i<ordered.length-1;i++){
      if(nowMin>ordered[i].end && nowMin<ordered[i+1].start){
        if(getComputedStyle(day).position==='static') day.style.position='relative';

        const dayRect=day.getBoundingClientRect();
        const beforeRect=ordered[i].card.getBoundingClientRect();
        const afterRect=ordered[i+1].card.getBoundingClientRect();
        const y=((beforeRect.bottom+afterRect.top)/2)-dayRect.top;

        const line=document.createElement('div');
        line.className='teacher-v-nowline';
        line.style.top=y+'px';

        const label=document.createElement('div');
        label.className='teacher-v-nowline-label';
        label.style.top=y+'px';
        label.textContent=`現在 ${pad(now.getHours())}:${pad(now.getMinutes())}`;

        day.appendChild(line);
        day.appendChild(label);
        return;
      }
    }
  }

  function start(){
    draw();
    setInterval(draw,15000);
    window.addEventListener('resize',draw);

    const root=document.getElementById('schedule')||document.body;
    const observer=new MutationObserver(()=>{
      clearTimeout(window.__teacherVNowlineTimer);
      window.__teacherVNowlineTimer=setTimeout(draw,80);
    });
    observer.observe(root,{childList:true,subtree:true});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>setTimeout(start,350));
  }else{
    setTimeout(start,350);
  }
})();
</script>
