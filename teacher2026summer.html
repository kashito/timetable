<script>
window.SharedClassState=(()=>{
  const API='state_api.php'; let cache={},loadFailed=false;
  async function loadAll(){
    try{const r=await fetch(API+'?v='+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'出席読込失敗');cache=j.state||{};loadFailed=false;}
    catch(e){console.warn(e);loadFailed=true;}
    return cache;
  }
  function get(k){return cache[k]||{};}
  async function save(k,patch){
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({eventKey:k},patch))});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'save failed'); cache[k]=j.state||{}; window.LessonFixed?.stateSaved(k,cache[k]); return cache[k];
  }
  function all(){return cache;}
  return {loadAll,get,save,all};
})();
</script>


<script>
(function(){
  const nativeFetch = window.fetch.bind(window);

  function aoaSheet(rows, headers){
    const data=[headers].concat(rows.map(r=>headers.map(h=>r[h] ?? '')));
    return XLSX.utils.aoa_to_sheet(data);
  }

  window.fetch = async function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if(url.includes('schedule.xlsx')){
      try{
        const apiRes = await nativeFetch('data_api.php?v='+Date.now(), {cache:'no-store'});
        const api = await apiRes.json();
        if(api && api.ok && api.initialized){
          const scheduleHeaders=['日付','日区分','授業ID','クラス','種別','給与区分','担当講師','教室','時間番号','開始','終了','科目','備考'];
          const studentHeaders=['生徒名','クラス','優先度'];

          const wb=XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, aoaSheet(api.schedule||[], scheduleHeaders), '時間割データ');
          XLSX.utils.book_append_sheet(wb, aoaSheet(api.students||[], studentHeaders), '生徒マスタ');

          const arr=XLSX.write(wb,{bookType:'xlsx',type:'array'});
          return new Response(arr,{
            status:200,
            headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
          });
        }
      }catch(e){
        console.warn('WEB編集データ読込失敗。Excelへフォールバックします。',e);
      }
    }
    return nativeFetch(input,init);
  };
})();
</script>

<script>
(function(){
  let showPast=false;

  function parseMD(text){
    const m=(text||'').match(/(\d{1,2})\/(\d{1,2})/);
    if(!m) return null;
    return new Date(2026, Number(m[1])-1, Number(m[2]));
  }

  function getDateGroups(){
    return Array.from(document.querySelectorAll('.date-cell')).map(dc=>{
      const d=parseMD(dc.textContent);
      if(!d) return null;
      const cells=[dc];
      let n=dc.nextElementSibling;
      for(let i=0;i<11 && n;i++,n=n.nextElementSibling) cells.push(n);
      return {date:d,cells};
    }).filter(Boolean);
  }

  function applyPastVisibility(){
    const today=new Date();
    today.setHours(0,0,0,0);
    getDateGroups().forEach(g=>{
      const hide=g.date<today && !showPast;
      g.cells.forEach(c=>c.classList.toggle('hidden-past-day',hide));
    });
  }

  function setupPastToggle(){
    if(document.getElementById('pastDayToggle')) return;
    const main=document.querySelector('main') || document.body;
    const wrap=document.createElement('div');
    wrap.className='past-toggle-wrap';
    wrap.innerHTML='<label class="past-toggle-label"><input id="pastDayToggle" type="checkbox"><span>終了した日も表示</span></label>';
    main.insertBefore(wrap, main.firstChild);
    wrap.querySelector('input').addEventListener('change',e=>{
      showPast=e.target.checked;
      applyPastVisibility();
      drawNowLine();
    });
  }

  function drawNowLine(){window.WholeNowLine?.draw();}

  function initLocalClock(){
    setupPastToggle();
    applyPastVisibility();

  }

  if(document.readyState==='loading'){

  }else{
    setTimeout(initLocalClock,800);
  }
window.applyPastVisibility=applyPastVisibility;window.drawNowLine=drawNowLine;document.addEventListener('history-window-change',()=>{applyPastVisibility();drawNowLine();});
})();
</script>


<script>
(function(){
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const norm=v=>String(v??'').trim();

  function makeAutoSeries(r){
    const subs=String(r['科目']||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).join('+');
    return [norm(r['クラス']),norm(r['種別']),norm(r['担当講師']),subs].filter(Boolean).join('|');
  }
  function occurrenceKey(r){
    const subs=String(r['科目']||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).join('+');
    return [normalizeDate(r['日付']),norm(r['時間番号']),norm(r['クラス']),norm(r['担当講師']),norm(r['種別']),subs].join('|');
  }
  function normalizeDate(v){
    if(typeof v==='number'){
      const p=XLSX.SSF.parse_date_code(v);
      return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:'';
    }
    const s=String(v||'').trim();
    const m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:s.slice(0,10);
  }
  
  let classMemoCache={};
  async function loadAllClassMemos(){
    try{
      const r=await fetch('state_api.php?action=getAllClassMemos&v='+Date.now(),{cache:'no-store'});
      const j=await r.json();
      if(!r.ok||!j.ok) throw new Error(j.error||'共有コメントの読込に失敗しました');
      classMemoCache=(j.classMemos&&typeof j.classMemos==='object')?j.classMemos:{};
    }catch(e){
      console.warn('共有コメント一覧読込失敗',e);
      classMemoCache=classMemoCache||{};
    }
    return classMemoCache;
  }
  async function loadClassMemo(cls){
    const className=String(cls||'').trim();
    if(!className) return '';
    try{
      const r=await fetch('state_api.php?action=getClassMemo&classKey='+encodeURIComponent(className)+'&v='+Date.now(),{cache:'no-store'});
      const j=await r.json();
      if(!r.ok||!j.ok) throw new Error(j.error||'共有コメントの読込に失敗しました');
      classMemoCache[className]=String(j.classMemo||'');
      return classMemoCache[className];
    }catch(e){
      console.warn('共有コメント読込失敗',e);
      return String(classMemoCache[className]||'');
    }
  }

  async function saveClassMemo(cls,memo){
    return SharedNotes.post(cls,document.querySelector('#teacherMemo'));
  }

async function workbookData(){
    const response=await fetch('data_api.php?v='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('最新の時間割を読み込めません');
    const current=await response.json();
    if(!current.ok)throw new Error(current.error||'時間割読込失敗');
    if(current.initialized)return {rows:current.schedule||[],members:current.students||[]};
    const r=await fetch('schedule.xlsx?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) return {rows:[],members:[]};
    const b=await r.arrayBuffer();
    const wb=XLSX.read(b,{type:'array'});
    const ws=wb.Sheets['時間割データ']||wb.Sheets[wb.SheetNames[0]];
    const sws=wb.Sheets['生徒マスタ'];
    return {
      rows:XLSX.utils.sheet_to_json(ws,{defval:''}),
      members:sws?XLSX.utils.sheet_to_json(sws,{defval:''}):[]
    };
  }
  
  function stateForCard(card){
    const exact=SharedClassState.get(card.dataset.key)||{};
    if(Object.keys(exact).length) return exact;
    const all=typeof SharedClassState.all==='function'?SharedClassState.all():{};
    const date=String(card.dataset.date||'');
    const slot=String(card.dataset.slot||'');
    const cls=String(card.dataset.class||card.querySelector('.event-title')?.textContent||'').trim();
    for(const [k,v] of Object.entries(all||{})){
      const ks=String(k);
      if(date && slot && cls && ks.includes(date) && ks.includes(slot) && ks.includes(cls)) return v||{};
    }
    return {};
  }

    await loadAllClassMemos();

      const cardClass=String(card.dataset.class||card.querySelector('.event-title')?.textContent||'').trim();

      const hasPublic=!!String(st.publicNote||'').trim();

      } else if(!hasTeacher && teacherIcon) teacherIcon.remove();

  async function loadLessonRecord(eventKey){

      const r=await fetch('lesson_record_api.php?key='+encodeURIComponent(eventKey)+'&v='+Date.now(),{cache:'no-store'});

      <div class="ops-summary"><span class="ops-chip">📅 ${esc(cardDate)}</span><span class="ops-chip">🕒 ${esc(cardSlot)}</span>${cardTeacher?`<span class="ops-chip">👤 ${esc(cardTeacher)}</span>`:''}${cardRoom?`<span class="ops-chip">🏫 ${esc(cardRoom)}</span>`:''}</div>
      <section class="ops-sec record-sec">

        <textarea id="lessonRecordMemo" placeholder="例：理解度、つまずき、次回の対応、保護者共有事項など">${esc(lessonRecord.memo||'')}</textarea>
        <div data-recording-key="${esc(key)}"></div>
        <label style="display:block;margin-top:10px;font-weight:900">📚 次回までの宿題</label><textarea id="lessonHomework" class="homework-input" placeholder="次回の同じ授業コマに表示する宿題">${esc(lessonRecord.homework||'')}</textarea><div><button type="button" class="ws-button" data-homework-none="#lessonHomework">宿題なしを入力</button><small>入力後、保存してください。空欄は未記入として通知します。</small></div>
        <small>カルテと宿題はこの日・このコマに保存され、宿題は次回の同じ授業に引き継いで表示されます。</small>

          ${seriesRows.map(r=>{
            const d=normalizeDate(r['日付']);
            const slot=norm(r['時間番号']);
            const endMap={'①':'14:10','②':'15:00','③':'15:50','④':'16:40','⑤':'17:30','⑥':'18:20','⑦':'19:10','⑧':'20:00','⑨':'20:50','⑩':'21:40','⑪':'22:30'};
            const endTime=norm(r['終了'])||endMap[slot]||'23:59';
            const dt=new Date(d+'T'+endTime+':00');
            const past=!isNaN(dt.getTime()) && dt < new Date();
            const nextSubs=String(r['科目']||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).join('+');
            const nextKey=[d,slot,norm(r['クラス']),norm(r['担当講師']),norm(r['種別']),nextSubs].join('|');

              ? ['日','月','火','水','木','金','土'][new Date(yy,mm-1,dd,12,0,0).getDay()]

              '①':'13:30','②':'14:20','③':'15:10','④':'16:00','⑤':'16:50','⑥':'17:40',
              '⑦':'18:30','⑧':'19:20','⑨':'20:10','⑩':'21:00','⑪':'21:50'
            };

            const toClock=value=>{
              if(typeof value==='number' && value>=0 && value<1){
                const mins=Math.round(value*24*60);
                return `${String(Math.floor(mins/60)%24).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
              }
              const s=String(value??'').trim();
              if(/^\d*\.?\d+$/.test(s)){
                const n=Number(s);

                  const mins=Math.round(n*24*60);
                  return `${String(Math.floor(mins/60)%24).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
                }
              }
              const tm=s.match(/(\d{1,2}):(\d{2})/);
              return tm?`${String(Number(tm[1])).padStart(2,'0')}:${tm[2]}`:'';
            };

        list.querySelectorAll('.student-file-delete').forEach(btn=>{

            btn.disabled=true;
            try{ await StudentAttachments.remove(key,btn.dataset.id); await renderStudentFiles(); await applyAttachmentIndicators(); }
            catch(e){ if(msg) msg.textContent='削除失敗：'+(e.message||e); }
          };
        });
      }catch(e){ if(msg) msg.textContent='添付読込失敗：'+(e.message||e); }
    }
    const fileInput=modal.querySelector('#studentFileInput');
    const fileUpload=modal.querySelector('#studentFileUpload');
    if(fileUpload && fileInput){
      fileUpload.onclick=async()=>{
        const files=[...fileInput.files];

        if(!files.length){ if(msg) msg.textContent='ファイルを選択してください。'; return; }
        fileUpload.disabled=true; fileUpload.textContent='アップロード中…'; if(msg) msg.textContent='';
        try{

          await renderStudentFiles(); await applyAttachmentIndicators();
        }catch(e){ if(msg) msg.textContent='アップロード失敗：'+(e.message||e); }
        finally{ fileUpload.disabled=false; fileUpload.textContent='📎 ファイルを追加'; }
      };
    }
    renderStudentFiles();


    const memoSaveBtn=modal.querySelector('#teacherMemoSave');
    const memoMsg=modal.querySelector('#teacherMemoMsg');
    const memoInput=modal.querySelector('#teacherMemo');
    SharedNotes.mount(memoInput,cls);

    if(memoInput){
      memoInput.oninput=()=>{
        if(memoMsg){
          memoMsg.textContent='未保存の変更があります';
          memoMsg.classList.remove('memo-save-success');

      };
    }

    if(memoSaveBtn){
      memoSaveBtn.onclick=async()=>{
        memoSaveBtn.disabled=true;
        memoSaveBtn.textContent='保存中…';
        if(memoMsg){
          memoMsg.textContent='保存中…';
          memoMsg.classList.remove('memo-save-success');

        try{
          await saveClassMemo(cls,memoInput?.value||'');
          await SharedClassState.loadAll();
          if(typeof applyCommentIndicators==='function') await applyCommentIndicators();
          memoSaveBtn.textContent='✓ 保存済み';
          if(memoMsg){
            memoMsg.textContent='✓ 保存しました（同じクラスに共有済み）';
            memoMsg.classList.add('memo-save-success');
          }
        }catch(e){
          memoSaveBtn.textContent='保存失敗';
          if(memoMsg) memoMsg.textContent='保存失敗：'+(e.message||e);
        }finally{
          memoSaveBtn.disabled=false;
          setTimeout(()=>{
            if(memoSaveBtn.textContent==='✓ 保存済み') memoSaveBtn.textContent='共有メモを投稿';
          },2000);
        }
      };
    }

    
    const roomChangeSave=modal.querySelector('#roomChangeSave');
    if(roomChangeSave){
      roomChangeSave.onclick=async()=>{
        const msg=modal.querySelector('#roomChangeMsg');

async function saveOpsAndClose(){
      const msg=modal.querySelector('#opsMsg');
      const confirmBox=document.getElementById('opsSaveConfirm');
      if(confirmBox) confirmBox.classList.add('hidden');
      try{
        if(detailLoadFailed)throw new Error('読込に失敗した項目があります。詳細を開き直してください。');
        if(msg) msg.textContent='保存中…';
        const attendance={};
        modal.querySelectorAll('.attSel').forEach(x=>{ if(x.value&&x.value!=='---'&&!(x.dataset.autoExempt==='true'&&x.value==='免除')) attendance[x.dataset.name]=x.value; });
        const saveKey=modal.dataset.currentKey||key;
        await SharedClassState.save(saveKey,{
          publicNote:modal.querySelector('#publicNote')?.value||'',
          ready:!!modal.querySelector('#readyCheck')?.checked,
          attendance,
          attendanceTouched:true
        });
        // 講師共有メモも通常の保存ボタンで保存する
        await saveClassMemo(modal.dataset.currentClass||cls, modal.querySelector('#teacherMemo')?.value||'');
        // この日・このコマ固有のカルテを別データとして保存する
        if(!lessonRecord._loadFailed) await saveLessonRecord({
          eventKey:saveKey,
          memo:modal.querySelector('#lessonRecordMemo')?.value||'',
          homework:modal.querySelector('#lessonHomework')?.value||'',
          date:cardDate,
          slot:cardSlot,
          className:modal.dataset.currentClass||cls,
          teacher:cardTeacher,
          room:modal.querySelector('#roomChangeSelect')?.value||cardRoom,
          subject:cardSubject
        });
        if(msg) msg.textContent='保存しました。';
        try{
          if(typeof applyReadyOnce==='function') await applyReadyOnce();
          else if(typeof applyReady==='function') await applyReady();
          if(typeof applyCommentIndicators==='function') await applyCommentIndicators();
        }catch(uiError){ console.warn('保存後の画面更新に失敗',uiError); }
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden','true');window.HistoryWindow?.restore(savedPosition);
        return true;
      }catch(saveError){
        if(msg) msg.textContent='保存に失敗しました：'+(saveError.message||saveError);
        return false;
      }
    }

    function hideOpsWithoutSave(){
      const confirmBox=document.getElementById('opsSaveConfirm');
      if(confirmBox) confirmBox.classList.add('hidden');
      modal.classList.add('hidden');
      modal.setAttribute('aria-hidden','true');window.HistoryWindow?.restore(savedPosition);
    }

    const opsFormState=()=>JSON.stringify([...modal.querySelectorAll('#opsBody textarea,#opsBody select,#opsBody input[type=checkbox]')].filter(e=>!e.closest('.shared-notes-list,.sc-inbox')).map(e=>[e.id||e.dataset.name,e.type==='checkbox'?e.checked:e.value]));
    let initialOpsFormState=opsFormState();
    function requestOpsClose(){
      if(SharedNotes.busy(memoInput)){memoMsg.textContent='共有メモを保存中です。完了後に閉じてください。';return;}
      if(opsFormState()===initialOpsFormState){hideOpsWithoutSave();return;}
      let box=document.getElementById('opsSaveConfirm');
      if(!box){
        box=document.createElement('div');
        box.id='opsSaveConfirm';
        box.className='ops-save-confirm hidden';
        box.innerHTML=`<div class="ops-save-confirm-box">
          <div class="ops-save-confirm-title">変更内容を保存して閉じますか？</div>
          <div class="ops-save-confirm-actions">
            <button id="opsConfirmYes" type="button">保存して閉じる</button>
            <button id="opsConfirmNo" type="button">保存せず閉じる</button>
          </div>
        </div>`;
        document.body.appendChild(box);
      }
      box.classList.remove('hidden');
      const yes=box.querySelector('#opsConfirmYes');
      const no=box.querySelector('#opsConfirmNo');
      yes.onclick=async e=>{
        e.preventDefault();e.stopPropagation();
        yes.disabled=true; no.disabled=true; yes.textContent='保存中…';
        const ok=await saveOpsAndClose();
        if(!ok){ box.classList.add('hidden'); }
        yes.disabled=false; no.disabled=false; yes.textContent='保存して閉じる';
      };
      no.onclick=e=>{ e.preventDefault();e.stopPropagation(); hideOpsWithoutSave(); };
    }

    const shortcuts=document.createElement('div');shortcuts.className='detail-shortcuts';shortcuts.innerHTML=`<a href="class_schedule.html?class=${encodeURIComponent(cls)}">この授業の全予定</a><a href="lesson_records.html?class=${encodeURIComponent(cls)}">カルテ一覧</a><button type="button" data-manage-class="${esc(cls)}">参加生徒</button>`;modal.querySelector('#opsBody').prepend(shortcuts);
    let footer=modal.querySelector('.ops-footer');if(!footer){footer=document.createElement('div');footer.className='ops-footer';modal.querySelector('.teacher-ops-panel').appendChild(footer);}footer.replaceChildren();if(StaffAuth.user?.role==='admin'&&card.dataset.sourceKey){const remove=document.createElement('button');remove.type='button';remove.className='ws-button';remove.textContent='この授業を削除';remove.style.color='#a12323';remove.onclick=async()=>{if(!confirm(card.dataset.date+' '+card.dataset.slot+' '+cls+' の予定を削除しますか？カルテ・出席記録は保持します。'))return;remove.disabled=true;try{await Workspace.api('lesson_add_api.php',{action:'delete',sourceKey:card.dataset.sourceKey});hideOpsWithoutSave();await WholeSchedule.reload();window.HistoryWindow?.restore(savedPosition);}catch(err){remove.disabled=false;modal.querySelector('#opsMsg').textContent=err.message;}};footer.append(remove);}const fixedSave=modal.querySelector('#opsSave');if(fixedSave)footer.appendChild(fixedSave);const fixedMsg=modal.querySelector('#opsMsg');if(fixedMsg)footer.appendChild(fixedMsg);
    if(detailLoadFailed){modal.querySelector('#opsMsg').textContent='読込失敗：データ保護のため保存できません。詳細を開き直してください。';for(const id of ['teacherMemoSave','lessonRecordSave']){const button=modal.querySelector('#'+id);if(button)button.disabled=true;}}
    if(window.LessonFixed)LessonFixed.editor(key,modal.querySelector('.ops-summary'));
    const saveBtn=modal.querySelector('#opsSave');
    if(saveBtn) saveBtn.onclick=async e=>{ e.preventDefault();e.stopPropagation(); await saveOpsAndClose(); };
    const closeBtn=modal.querySelector('#opsClose');
    if(closeBtn) closeBtn.onclick=e=>{ e.preventDefault();e.stopPropagation(); requestOpsClose(); };
    modal.onclick=e=>{if(e.target.closest('[data-back-notices]')&&opsFormState()!==initialOpsFormState&&!confirm('未保存の変更があります。保存せずお知らせに戻りますか？')){e.preventDefault();return;} if(e.target===modal){ e.preventDefault(); requestOpsClose(); } };
  }

  function fallbackDetail(card,err){
    console.error('詳細表示エラー',err);
    const modal=document.getElementById('modal');
    const body=document.getElementById('modalBody');
    if(!modal||!body) return;
    const title=card.querySelector('.event-title')?.textContent?.trim()||'授業詳細';
    const teacher=card.querySelector('.event-teacher')?.textContent?.trim()||'';
    const meta=card.querySelector('.event-meta')?.textContent?.trim()||'';
    body.innerHTML='<h2>'+title.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</h2>'+
      (teacher?'<p>'+teacher+'</p>':'')+(meta?'<p>'+meta+'</p>':'')+'<p style="color:#b91c1c;font-weight:700">詳細データを読み込めませんでした。ページを再読み込みしてください。</p>';
    modal.classList.remove('hidden');modal.setAttribute('aria-hidden','false'); modal.setAttribute('aria-hidden','false');
  }

  let detailOpening=false;
  function bindCards(){
    const root=document.getElementById('schedule');
    if(!root || root.dataset.opsClickBound==='1') return;
    root.dataset.opsClickBound='1';
    // The schedule element survives every render. Handle clicks here immediately,
    // without waiting for the observer to attach a listener to each new card.
    root.addEventListener('click',async e=>{
      const card=e.target.closest('.event[data-key],.list-item[data-key]');
      if(!card || !root.contains(card) || e.target.closest('button,input,select,textarea,a,[data-lesson-action]')) return;
      e.preventDefault();e.stopImmediatePropagation();
      if((typeof teacherDragJustFinished!=='undefined' && teacherDragJustFinished) || detailOpening) return;
      detailOpening=true;root.setAttribute('aria-busy','true');
      const loading=document.createElement('div');loading.id='teacherOpsLoading';loading.className='ops-loading';loading.setAttribute('role','status');loading.textContent='授業の詳細を読み込み中…';document.body.appendChild(loading);
      try{ await openOps(card); }
      catch(err){ fallbackDetail(card,err); }
      finally{detailOpening=false;root.removeAttribute('aria-busy');loading.remove();}
    },true);
  }

  function bind(){
    bindCards();
    if(document.documentElement.dataset.teacherOpsObserver==='1') return;
    document.documentElement.dataset.teacherOpsObserver='1';
    const root=document.getElementById('schedule');
    if(root){
      let uiTimer=null, uiRunning=false;
      new MutationObserver((mutations)=>{
        // アイコン自身の追加・削除では再描画しない（赤アイコンのちらつき防止）
        const structural=mutations.some(m=>{
          const t=m.target&&m.target.nodeType===1?m.target:null;
          if(t && (t.closest('.event-badges') || t.classList.contains('event-badges'))) return false;
          return [...m.addedNodes,...m.removedNodes].some(n=>n.nodeType===1 && (n.matches?.('.event,.day-block,.teacher-generator-layout') || n.querySelector?.('.event')));
        });
        if(!structural) return;
        clearTimeout(uiTimer);
        uiTimer=setTimeout(async()=>{ if(uiRunning)return; uiRunning=true; try{bindCards();await applyReadyOnce();}catch(e){console.error(e)}finally{uiRunning=false;} },120);
      }).observe(root,{childList:true,subtree:true});
    }
  }

  function reapplyTeacherUiAfterRender(){
    setTimeout(()=>{bind();applyReadyOnce();applyPastVisibility();drawNowLine()},250);
  }

  // 初回表示でも詳細クリック・コメントアイコン・準備完了表示を有効化
  bind();
  window.addEventListener('load',()=>{
    setTimeout(()=>{bind();applyReadyOnce();applyPastVisibility();drawNowLine()},500);
  });

  // 絞り込み・表示切替後も「過去日非表示」を維持
  ['classFilter','teacherFilter','roomFilter','typeFilter','subjectFilter','viewSelect'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener('change',reapplyTeacherUiAfterRender);
  });
  const clearBtn=document.getElementById('clearFilters');
  if(clearBtn) clearBtn.addEventListener('click',reapplyTeacherUiAfterRender);
})();
</script>

<script id="attachment-icons-v46">
(function(){
  let running=false, timer=null;
  async function paint(){
    if(running || !window.StudentAttachments) return;
    running=true;
    try{
      await StudentAttachments.loadAll();
      document.querySelectorAll('.event[data-key],.event-card[data-key],[data-key].list-item').forEach(card=>{
        const key=card.getAttribute('data-key')||'';
        const items=StudentAttachments.get(key)||[];
        let b=card.querySelector('.attachment-indicator-v46');
        if(items.length){
          if(!b){
            b=document.createElement('span');
            b.className='event-badge attachment-indicator attachment-indicator-v46';
            b.title='生徒向け添付ファイルあり';
            const host=card.querySelector('.event-badges,.tags')||card;
            host.appendChild(b);
          }
          const label='📎 '+items.length;if(b.textContent!==label)b.textContent=label;
        }else if(b){ b.remove(); }
      });
    }catch(e){ console.warn('添付アイコン表示エラー',e); }
    finally{ running=false; }
  }
  function schedule(mutations){
    const changed=mutations.some(m=>[...m.addedNodes,...m.removedNodes].some(n=>n.nodeType===1&&(n.matches?.('.event[data-key],.event-card[data-key],[data-key].list-item')||n.querySelector?.('.event[data-key],.event-card[data-key],[data-key].list-item'))));
    if(changed){clearTimeout(timer);timer=setTimeout(paint,80);}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{paint();new MutationObserver(schedule).observe(document.getElementById('schedule')||document.body,{childList:true,subtree:true});});
  else {paint();new MutationObserver(schedule).observe(document.getElementById('schedule')||document.body,{childList:true,subtree:true});}
  window.addEventListener('focus',paint);
  window.addEventListener('student-attachments-changed',paint);
})();
</script>
