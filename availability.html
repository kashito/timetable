<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勤務できる日時・NG</title><link rel="stylesheet" href="workspace-ui.css?v=20260912-r24"><script src="staff-auth.js?v=20260917-r56-ready" data-staff="required"></script><script defer src="workspace-ui.js?v=20260916-r54-ready"></script><style>.ng-slot-time,.ng-slot-arrival{display:block;white-space:nowrap;font-size:11px;line-height:1.45}.ng-slot-time{font-weight:400;margin-top:3px}.ng-slot-arrival{color:#355d73;font-weight:700;margin-top:1px}.ng-matrix th{min-width:88px}.ng-matrix th:first-child{min-width:110px}</style></head><body><main class="workspace-page"><p class="r46-build" style="font-size:11px;color:#607080;margin:4px 0;text-align:right">更新版 r46</p><h1>勤務できる日時・NG</h1><p class="lede">NGが多いときは「OKを選ぶ」に切り替え、勤務できるコマだけ選べます。</p><section class="ws-panel"><div class="ws-controls"><label>先生 <select id="availabilityTeacher"></select></label><label>開始日 <input id="availabilityStart" type="date"></label><label>日数 <select id="availabilityDays"><option value="7">7日</option><option value="14">14日</option><option value="31">31日</option></select></label><button id="availabilityLoad" class="ws-button">期間を表示</button><label>入力方式 <select id="availabilityMode"><option value="ng">NGを選ぶ</option><option value="ok">OKを選ぶ</option></select></label></div><p id="availabilityHelp" class="ws-muted"></p><div class="ws-controls"><button id="allUnavailable" class="ws-button">この期間をすべてNGにする</button><button id="allAvailable" class="ws-button">この期間をすべてOKにする</button></div><div id="availabilityGrid" class="ws-overflow"></div><label class="ws-form">変更メモ<input id="availabilityNote" placeholder="例：学校行事のため"></label></section><div class="ws-controls" style="position:sticky;bottom:0;background:#f1f6f9;padding:12px;border:1px solid #c9d9e4;border-radius:10px"><button id="availabilitySave" class="ws-button primary">表示中の期間を保存する</button><span id="availabilityMessage" class="ws-message" role="status"></span></div><p class="ws-muted">自分の勤務予定を登録・変更できます。他の先生のNGは表示されません（管理者を除く）。今日から7日先までの変更は、管理者の「更新履歴・お知らせ」に通知されます。授業が配置済みでも、時間割が自動で移動・削除されることはありません。</p><p data-admin><a href="teacher_ng.html">カレンダーから複数日をまとめて登録する</a></p></main><script defer src="availability.js?v=20260924-arrival"></script></body></html>
