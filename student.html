<script>
window.SharedClassState=(()=>{
  const API='state_api.php'; let cache={};
  async function loadAll(){
    try{const r=await fetch(API+'?v='+Date.now(),{cache:'no-store'});const j=await r.json();cache=j.state||{};}
    catch(e){console.error(e);cache={};}
    return cache;
  }
  function get(k){return cache[k]||{};}
  async function save(k,patch){
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({eventKey:k},patch))});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'save failed'); cache[k]=j.state||{}; return cache[k];
  }
  return {loadAll,get,save};
})();
</script>


<script>
(function(){
  const nativeFetch = window.fetch.bind(window);

  function aoaSheet(rows, headers){
    const data=[headers].concat(rows.map(r=>headers.map(h=>r[h] ?? '')));
    return XLSX.utils.aoa_to_sheet(data);
  }

  window.fetch = async function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if(url.includes('schedule.xlsx')){
      try{
        const apiRes = await nativeFetch('data_api.php?v='+Date.now(), {cache:'no-store'});
        const api = await apiRes.json();
        if(api && api.ok && api.initialized){
          const scheduleHeaders=['日付','日区分','授業ID','クラス','種別','担当講師','教室','時間番号','開始','終了','科目','備考'];
          const studentHeaders=['生徒名','クラス','優先度'];

          const wb=XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, aoaSheet(api.schedule||[], scheduleHeaders), '時間割データ');
          XLSX.utils.book_append_sheet(wb, aoaSheet(api.students||[], studentHeaders), '生徒マスタ');

          const arr=XLSX.write(wb,{bookType:'xlsx',type:'array'});
          return new Response(arr,{
            status:200,
            headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
          });
        }
      }catch(e){
        console.warn('WEB編集データ読込失敗。Excelへフォールバックします。',e);
      }
    }
    return nativeFetch(input,init);
  };
})();
</script>

  let lessonRecords = {};

  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const normName = v => String(v ?? '').replace(/[\s　]+/g,'').toLowerCase();
  const dayName = d => ['日','月','火','水','木','金','土'][new Date(d + 'T00:00:00').getDay()];

  function normalizeExcelTime(v) {
    if(v===''||v===null||v===undefined) return '';
    const toTime=n=>{
      const fraction=((Number(n)%1)+1)%1;
      let mins=Math.round(fraction*1440);
      if(mins>=1440) mins=0;
      return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
    };
    if(typeof v==='number'&&Number.isFinite(v)) return toTime(v);
    const s=String(v).trim();
    if(/^-?\d+(\.\d+)?$/.test(s)){
      const n=Number(s);
      if(Number.isFinite(n)&&n>=0&&n<2) return toTime(n);
    }
    const m=s.match(/^(\d{1,2}):(\d{2})/);
    return m?`${m[1].padStart(2,'0')}:${m[2]}`:s;
  }

  function normalizeExcelDate(v) {
    if (v === null || v === undefined || v === '') return '';

    const serialToDate = (n) => {
      const p = XLSX.SSF.parse_date_code(Number(n));
      if (!p) return '';
      return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
    };

    if (typeof v === 'number' && Number.isFinite(v)) {
      return serialToDate(v);
    }

    const str = String(v).trim();

    // Numeric string such as "46224"
    if (/^\d+(\.\d+)?$/.test(str)) {
      const n = Number(str);
      if (Number.isFinite(n) && n > 20000) {
        return serialToDate(n);
      }
    }

    const m = str.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;

    return '';
  }

  function normalizeRow(r) {
    const slot = String(r['時間番号'] || '').trim();
    const cls = String(r['クラス'] || '').trim();
    const type = String(r['種別'] || '').trim();
    const teacher = String(r['担当講師'] || '').trim();
    const subjects = String(r['科目'] || '').split(/[,、，]/).map(x=>x.trim()).filter(Boolean);
    const manualId = String(r['授業ID'] || '').trim();
    const autoId = [cls, type, teacher, subjects.join('+')].filter(Boolean).join('|');
    return {
      date: normalizeExcelDate(r['日付']),
      dayType: String(r['日区分'] || '').trim(),
      id: manualId || autoId,
      cls,
      type,
      teacher,
      room: String(r['教室'] || '').trim(),
      slot,
      start: normalizeExcelTime(r['開始']) || SLOTS[slot]?.[0] || '',
      end: normalizeExcelTime(r['終了']) || SLOTS[slot]?.[1] || '',
      subjects,
      note: String(r['備考'] || '').trim(),
      priority: Number(r['優先度'] || 0) || 0
    };
  }

  function dateRange(start, end) {
    const out = [];
    if (!start || !end) return out;

    const cur = new Date(start + 'T00:00:00');
    const last = new Date(end + 'T00:00:00');

    while (cur <= last) {
      const y = cur.getFullYear();
      const m = String(cur.getMonth() + 1).padStart(2, '0');
      const d = String(cur.getDate()).padStart(2, '0');
      out.push(`${y}-${m}-${d}`);
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }

  function displayDayType(v) {
    const text = String(v || '').trim();
    if (text === '休み') return '休講日';
    if (/^(サマキャン|サマーキャンプ)$/i.test(text)) return 'サマーキャンプ';
    return text;
  }

  // OFF・休講日・サマーキャンプ等は、日区分欄だけでなく
  // クラス／種別に入力されていた旧データも特別日として扱う。
  function specialDayLabel(r) {
    const candidates = [r.dayType, r.cls, r.type]
      .map(v => String(v || '').trim())
      .filter(Boolean);
    for (const value of candidates) {
      if (/^(OFF|休み|休講日|サマキャン|サマーキャンプ)$/i.test(value)) {
        return displayDayType(value);
      }
    }
    return '';
  }


  function normalizeRoomText(value){
    return String(value ?? '')
      .replace(/[\s　]+/g,'')
      .replace(/教室$/,'')
      .trim();
  }

  function normalizeKeyPart(value){
    return String(value ?? '').replace(/[\s　]+/g,'').trim();
  }

  function roomVisualClass(room){
    const v=normalizeRoomText(room);
    if(!v) return 'room-unset';
    if(v.includes('青')) return 'room-blue';
    if(v.includes('黄')) return 'room-yellow';
    if(v.includes('白')) return 'room-white';
    if(v.includes('ガラス')) return 'room-glass';
    if(v.toUpperCase().includes('PC')) return 'room-pc';
    if(v.includes('自宅')) return 'room-home';
    return 'room-other';
  }

  function lessonRoomKey(r){
    return [
      r.date,
      r.slot,
      r.cls,
      r.teacher,
      r.type,
      (r.subjects||[]).join('+')
    ].join('|');
  }

  function parseOverrideKey(key){
    const p=String(key||'').split('|');
    return {
      date:normalizeKeyPart(p[0]),
      slot:normalizeKeyPart(p[1]),
      cls:normalizeKeyPart(p[2]),
      teacher:normalizeKeyPart(p[3]),
      type:normalizeKeyPart(p[4]),
      subjects:normalizeKeyPart(p.slice(5).join('|'))
    };
  }

  function findRoomOverride(r){
    const exact=roomOverrideCache[lessonRoomKey(r)];
    if(exact && exact.room!==undefined) return exact;

    const target={
      date:normalizeKeyPart(r.date),
      slot:normalizeKeyPart(r.slot),
      cls:normalizeKeyPart(r.cls),
      teacher:normalizeKeyPart(r.teacher),
      type:normalizeKeyPart(r.type),
      subjects:normalizeKeyPart((r.subjects||[]).join('+'))
    };

    let best=null;
    let bestScore=-1;

    for(const [key,value] of Object.entries(roomOverrideCache)){
      if(!value || value.room===undefined) continue;
      const k=parseOverrideKey(key);

      if(k.date!==target.date || k.slot!==target.slot || k.cls!==target.cls) continue;

      let score=100;
      if(k.teacher && target.teacher && k.teacher===target.teacher) score+=20;
      if(k.type && target.type && k.type===target.type) score+=10;
      if(k.subjects && target.subjects && k.subjects===target.subjects) score+=5;

      if(score>bestScore){
        bestScore=score;
        best=value;
      }
    }

    return best;
  }

  function effectiveRoom(r){
    const override=findRoomOverride(r);
    if(override && override.room!==undefined){
      return String(override.room||'').trim();
    }
    return String(r.room||'').trim();
  }

  function roomInlineStyle(room){
    const cls=roomVisualClass(room);
    const palette={
      'room-unset':['#f3f4f6','#94a3b8'],
      'room-blue':['#dceeff','#2689d8'],
      'room-yellow':['#fff2b8','#e0ad00'],
      'room-white':['#ffffff','#b8c2cc'],
      'room-glass':['#dff8ff','#16abc4'],
      'room-pc':['#eadfff','#8056d6'],
      'room-home':['#ffe8cf','#ec7921'],
      'room-other':['#f4ead8','#9d6b2a']
    };
    const [bg,border]=palette[cls]||palette['room-unset'];
    return `background:${bg}!important;border-left-color:${border}!important;`;
  }


  function studentType(r) {
    return r.type === '補習' ? '補習' : (r.type ? '授業' : '');
  }

  function unique(key) {
    return [...new Set(rows.map(r => r[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ja'));
  }

  function belongsToStudent(r) {
    if (!selectedStudent) return false;
    return Array.isArray(selectedStudent.classes) && selectedStudent.classes.includes(r.cls) && (!window.Workspace||Workspace.roster(r.cls,r.date,managementPreview()).some(x=>normName(x['生徒名'])===normName(selectedStudent.name)));
  }

  function optionalForStudent(r){
    return !!selectedStudent&&Workspace.students.some(m=>normName(m['生徒名'])===normName(selectedStudent.name)&&m['クラス']===r.cls&&StudentParticipation.freeAt(m,r.date));
  }
  function optionalNote(r){return optionalForStudent(r)?'<div class="student-optional-note"><strong>自由参加</strong><span>'+esc(StudentParticipation.explanation)+'</span></div>':'';}

  function timeMinutes(v){
    const m=String(v||'').match(/^(\d{1,2}):(\d{2})/);
    return m?Number(m[1])*60+Number(m[2]):0;
  }

  function lessonDateTime(date,time){
    const m=String(time||'').match(/^(\d{1,2}):(\d{2})/);
    if(!date || !m) return null;
    const d=new Date(`${date}T${String(m[1]).padStart(2,'0')}:${m[2]}:00`);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function formatLessonGap(prevDate, prevStartTime, nextDate, nextStartTime){
    // 「前回からどのくらい」は、前回授業の開始時刻 → 今回授業の開始時刻で計算する。
    // 授業時間そのものを差し引いた「空き時間」ではなく、同タイトル授業の実施間隔を表示する。
    const a=lessonDateTime(prevDate, prevStartTime);
    const b=lessonDateTime(nextDate, nextStartTime);
    if(!a || !b) return '';
    let mins=Math.floor((b-a)/60000);
    if(mins<=0) return '';
    const days=Math.floor(mins/1440); mins%=1440;
    const hours=Math.floor(mins/60);
    const minutes=mins%60;
    const parts=[];
    if(days) parts.push(`${days}日`);
    if(hours) parts.push(`${hours}時間`);
    if(!days && minutes) parts.push(`${minutes}分`);
    return parts.join('');
  }

  function overlaps(a,b){
    return timeMinutes(a.start)<timeMinutes(b.end) && timeMinutes(b.start)<timeMinutes(a.end);
  }

  function resolvePriorityConflicts(list){
    if(!selectedStudent) return list;

    const priorityMap = studentMembershipPriority[normName(selectedStudent.name)] || {};
    const byDate = {};

    list.forEach(r => {
      (byDate[r.date] || (byDate[r.date] = [])).push(r);
    });

    const kept = [];

    const mins = v => {
      const m=String(v||'').match(/^(\d{1,2}):(\d{2})/);
      return m ? Number(m[1])*60+Number(m[2]) : 0;
    };
    const overlaps = (a,b) => mins(a.start) < mins(b.end) && mins(b.start) < mins(a.end);

    Object.values(byDate).forEach(dayRows => {
      dayRows.forEach(r => {
        const conflicts = dayRows.filter(x => x !== r && overlaps(r,x));
        if(!conflicts.length){
          kept.push(r);
          return;
        }
        const myPriority = Number(priorityMap[r.cls] || 0);
        const maxPriority = Math.max(
          myPriority,
          ...conflicts.map(x => Number(priorityMap[x.cls] || 0))
        );
        if(myPriority === maxPriority) kept.push(r);
      });
    });

    return [...new Set(kept)];
  }

  function isExemptForSelectedStudent(r){
    if(!selectedStudent) return false;

    const studentKey=normName(selectedStudent.name);
    const exactKey=lessonRoomKey(r);
    let st=SharedClassState.get(exactKey)||null;

    // 旧データや編集後データで担当講師・種別・科目の表記が変わっていても、
    // 日付・コマ・クラスが一致する出席データを安全に拾う。
    if(!st || !st.attendance){
      const prefix=[r.date,r.slot,r.cls].join('|')+'|';
      try{
        const all=(SharedClassState.state && typeof SharedClassState.state==='object')
          ? SharedClassState.state
          : {};
        const matchedKey=Object.keys(all).find(k=>
          String(k).startsWith(prefix) &&
          all[k] &&
          all[k].attendance &&
          typeof all[k].attendance==='object'
        );
        if(matchedKey) st=all[matchedKey];
      }catch(e){}
    }

    const att=(st && st.attendance && typeof st.attendance==='object')
      ? st.attendance
      : {};

    if(window.Workspace)return Workspace.exempt(selectedStudent.name,r.cls,r.date,st||{});
    return Object.entries(att).some(([name,status])=>
      normName(name)===studentKey && String(status||'').trim()==='免除'
    );
  }

  function render() {
    document.dispatchEvent(new CustomEvent('student-schedule-selected',{detail:{name:selectedStudent?.name||''}}));
    if(!selectedStudent){renderedRows=[];$('schedule').innerHTML='<div class="empty">生徒名を決定すると、その生徒の予定を表示します。</div>';$('status').textContent='生徒名を決定してください。';document.dispatchEvent(new Event('student-selection-changed'));return;}
    const specials = rows.filter(r => specialDayLabel(r));
    const allNormal = rows.filter(r => !specialDayLabel(r));

    // Student's own schedule before optional filters. Exempt lessons are not part of the individual schedule.
    const studentNormalRaw = allNormal.filter(r => belongsToStudent(r) && !isExemptForSelectedStudent(r));
    const studentNormal = resolvePriorityConflicts(studentNormalRaw);
    // Visible schedule after optional filters.
    const visibleNormal = studentNormal;
    renderedRows = visibleNormal;

    // 同じタイトルの直前授業からの経過時間を表示する。
    // ただし、直前コマが同じタイトルで連続している授業には表示しない。
    // その日の最初の授業、途中に空きコマがある授業、または直前コマが別タイトルの授業では表示する。
    const studentTimeline = [...studentNormal].sort((a,b)=>(a.date+a.start+a.end).localeCompare(b.date+b.start+b.end));
    const previousSameTitleGap = new Map();
    const lastLessonByTitle = new Map();
    const previousLessonInDay = new Map();
    for (const cur of studentTimeline) {
      const title = String(cur.cls || studentType(cur) || '').trim();
      const prevInDay = previousLessonInDay.get(cur.date);
      // 「連続」は終了時刻=開始時刻ではなく、時間割上で隣り合うコマかどうかで判定する。
      // 例：⑥ 17:40-18:20 → ⑦ 18:30-19:10 は10分休憩を挟むが連続授業として扱う。
      const slotOrder = Object.keys(SLOTS);
      const prevSlotIndex = prevInDay ? slotOrder.indexOf(String(prevInDay.slot || '').trim()) : -1;
      const curSlotIndex = slotOrder.indexOf(String(cur.slot || '').trim());
      const isAdjacentSlot = !!(prevInDay && prevSlotIndex >= 0 && curSlotIndex === prevSlotIndex + 1);
      const prevInDayTitle = prevInDay ? String(prevInDay.cls || studentType(prevInDay) || '').trim() : '';
      // 経過時間を隠すのは「直前コマも同じタイトル」の連続授業だけ。
      // 直前コマが食事休憩や別タイトルなら、コマ番号が連続していても表示する。
      const isConsecutiveSameTitle = !!(isAdjacentSlot && title && prevInDayTitle === title);

      if (title) {
        const prevSameTitle = lastLessonByTitle.get(title);
        if (prevSameTitle && !isConsecutiveSameTitle) {
          const gap = formatLessonGap(prevSameTitle.date, prevSameTitle.start, cur.date, cur.start) || '';
          if (gap) previousSameTitleGap.set(lessonRoomKey(cur), gap);
        }
        lastLessonByTitle.set(title, cur);
      }
      previousLessonInDay.set(cur.date, cur);
    }


    // 宿題は「同じ授業の次の授業日」に引き継ぐ。
    // 同じ日に同一授業が2コマ以上あっても1回分として扱い、同日内では引き継がない。
    const homeworkForKey = new Map();
    const bySeriesDay = new Map();
    for(const cur of studentTimeline){
      const series=String(cur.cls||'').trim();
      if(!series) continue;
      if(!bySeriesDay.has(series)) bySeriesDay.set(series,new Map());
      const dayMap=bySeriesDay.get(series);
      if(!dayMap.has(cur.date)) dayMap.set(cur.date,[]);
      dayMap.get(cur.date).push(cur);
    }
    for(const [,dayMap] of bySeriesDay){
      const days=[...dayMap.keys()].sort();
      for(let i=1;i<days.length;i++){
        const prevRows=dayMap.get(days[i-1])||[];
        const homeworks=[];
        for(const prev of prevRows){
          const rec=lessonRecords[lessonRoomKey(prev)]||{};
          const hw=String(rec.homework||'').trim();
          if(hw&&!homeworks.includes(hw)) homeworks.push(hw);
        }
        const carried=homeworks.join('\n');
        if(carried){
          for(const cur of (dayMap.get(days[i])||[])) homeworkForKey.set(lessonRoomKey(cur),carried);
        }
      }
    }

    // Always show the full Summer Course 2026 period.
    // Even when a date has no row in Excel at all, it is still shown.
    // Empty days distinguish pending schedules from designated school holidays.
    const availableDates = [...new Set(rows.map(r => r.date).filter(Boolean))].sort();
    const today = new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
    const rangeStart = window.HistoryWindow ? HistoryWindow.start() : today;
    const horizon = new Date((rangeStart>today?rangeStart:today)+'T00:00:00');horizon.setDate(horizon.getDate()+120);
    const rangeEnd = [availableDates[availableDates.length-1]||'',horizon.toLocaleDateString('sv-SE')].sort().at(-1);
    const dates = rangeStart ? dateRange(rangeStart, rangeEnd) : [];
    let html = '';

    for (const date of dates) {
      const daySpecials = specials.filter(r => r.date === date);
      const special = daySpecials[0] || null;
      const studentEvents = studentNormal
        .filter(r => r.date === date)
        .sort((a,b)=>(a.start+a.cls).localeCompare(b.start+b.cls));

      const visibleEvents = LinkedSchedule.merge(visibleNormal.filter(r => r.date === date),lessonRoomKey,effectiveRoom);

      const dayMeetingStart = studentEvents.length ? studentEvents[0].start : '';
      const dayMeetingEnd = studentEvents.length ? studentEvents.reduce((latest, item) =>
        timeMinutes(item.end) > timeMinutes(latest) ? item.end : latest, studentEvents[0].end) : '';
      const dayTimeSummary = dayMeetingStart && dayMeetingEnd
        ? `<span class="day-title-summary">集合 ${esc(dayMeetingStart)} ／ 終了 ${esc(dayMeetingEnd)}</span>`
        : '';

      const isOffDay = !special && selectedStudent && studentEvents.length === 0;
      const specialClassName = special ? ' has-special-day' : '';
      const schoolHoliday=!!(window.SchoolHolidays&&SchoolHolidays.isHoliday(date));
      html += `<section class="day-group${isOffDay ? ' has-off-day' : ''}${specialClassName}${schoolHoliday ? ' is-school-holiday' : ''}" data-date="${esc(date)}">
        <div class="day-title"><span>${esc(date.slice(5).replace('-','/'))}（${dayName(date)}）${schoolHoliday?'<b class="school-holiday-label">休講日</b>':''}</span>${dayTimeSummary}</div><div class="ce-day-events" data-calendar-date="${esc(date)}"></div>`;

      // 特別日（サマーキャンプ・休講日など）の表示と、同日に入っている授業表示は両立させる。
      // 特別日があることを理由に授業カードを隠さない。
      if (special) {
        html += daySpecials.map(item => {
          const originalLabel=specialDayLabel(item);
          const label=/^OFF$/i.test(originalLabel)?SchoolHolidays.emptyDayLabel(date):originalLabel;
          return `<div class="special special-day">${esc(label)}${item.note ? `<small>${esc(item.note)}</small>` : ''}</div>`;
        }).join('');
      }

      if (selectedStudent && studentEvents.length === 0) {
        // 予定がない日の案内。休講日指定を優先し、未確定の予定をOFFと案内しない。
        if (!special) html += `<div class="special off-day">${esc(SchoolHolidays.emptyDayLabel(date))}</div>`;
      } else if (visibleEvents.length === 0 && studentEvents.length > 0) {
        // Student has a class, but current optional filters hide it.
        html += `<div class="empty">絞り込み条件に一致する予定はありません。</div>`;
      } else {
        let occupiedUntil=0;
        for (let eventIndex = 0; eventIndex < visibleEvents.length; eventIndex++) {
          const r = visibleEvents[eventIndex];
          const type = studentType(r);
          const icon = type === '補習' ? '🧩' : '📘';
          const specialClass =
            (r.cls.includes('食事休憩') || r.note.includes('食事休憩')) ? ' is-break' :
            (r.type === '補習') ? ' is-remedial' : '';
          const actualRoom=effectiveRoom(r);
          const cardStyle=specialClass.includes('is-break')
            ? ''
            : roomInlineStyle(actualRoom);

          html += `<article class="event-card ${roomVisualClass(actualRoom)}${specialClass}"
            style="${cardStyle}"
            data-key="${esc(lessonRoomKey(r))}" ${LinkedSchedule.attributes(r)}
            data-series-id="${esc(r.id)}"
            data-room="${esc(actualRoom)}"
            data-date="${esc(r.date)}"
            data-time="${esc(r.start)}-${esc(r.end)}">
            <div class="event-top">
              <div>
                <div class="event-time">${esc(LinkedSchedule.label(r))} ${esc(r.start)}–${esc(r.end)}</div>
                <div class="event-class">${esc(r.cls || type)}</div>
              </div>
              <div>${icon}</div>
            </div>
            ${optionalNote(r)}
            <div class="event-sub">${r._linked?.mealBreak?'<p class="linked-meal-notice">途中で食事休憩が入ります</p>':''}${r.teacher ? `担当 ${esc(r.teacher)}` : ''}</div>
            ${homeworkForKey.get(lessonRoomKey(r)) ? `<div class="student-homework"><strong>📚 宿題</strong>${esc(homeworkForKey.get(lessonRoomKey(r)))}</div>` : ''}
            ${previousSameTitleGap.get(lessonRoomKey(r)) ? `<div class="student-prev-gap">前回の「${esc(r.cls || type)}」から <strong>${esc(previousSameTitleGap.get(lessonRoomKey(r)))}</strong> 空いています</div>` : ''}
            ${[...new Set((r._linked?.members||[r]).map(m=>SharedClassState.get(lessonRoomKey(m))?.publicNote||m.note).filter(Boolean))].map(note=>`<div class="shared-public-note"><strong>📢 先生から生徒へのメッセージ</strong><br>${esc(note)}</div>`).join('')}
            <div class="lesson-countdown" data-countdown></div>
            <div class="tags">
              ${r.cls ? `<span class="tag tag-class">${esc(r.cls)}</span>` : ''}
              ${type ? `<span class="tag tag-type">${icon} ${esc(type)}</span>` : ''}
              ${actualRoom ? `<span class="tag tag-room">🏫 ${esc(actualRoom)}</span>` : ''}
            </div>
            ${selectedStudent&&r.date>=today?`<div class="sc-card-actions"><button type="button" class="sc-open" data-contact-open data-contact-keys="${esc(JSON.stringify((r._linked?.members||[r]).map(lessonRoomKey)))}">遅刻・欠席を連絡（β版）</button><button type="button" class="sc-card-status" data-contact-history hidden data-contact-keys="${esc(JSON.stringify((r._linked?.members||[r]).map(lessonRoomKey)))}"></button></div>`:''}
            <button type="button" class="student-card-send-btn" data-send-key="${esc(lessonRoomKey(r))}">📤 先生へ資料を送る</button>
            ${(()=>{
              const sent=(window.StudentAttachments?StudentAttachments.get(lessonRoomKey(r)):[]).filter(a=>a.sender==='student'&&a.canDelete);
              return sent.length ? `<div class="student-sent-files"><strong>送信済み資料</strong>${sent.map(a=>`<div class="student-sent-file"><a href="${StudentAttachments.rawUrl(a)}" download="${esc(a.name)}" target="_blank" rel="noopener">${esc(a.name)}</a><button type="button" class="student-file-delete-btn" data-delete-key="${esc(lessonRoomKey(r))}" data-delete-id="${esc(a.id)}">削除</button></div>`).join('')}</div>` : '';
            })()}
          </article>`;

          // 個人ページ：連続する授業の間に空き時間を表示する。
          // 既存の授業表示・絞り込み・保存処理には影響させない表示専用処理。
          occupiedUntil=Math.max(occupiedUntil,timeMinutes(r.end));
          const nextEvent = visibleEvents[eventIndex + 1];
          if (nextEvent) {
            const gapMinutes = timeMinutes(nextEvent.start) - occupiedUntil;
            if (gapMinutes > 0) {
              html += `<div class="student-free-gap">空き ${gapMinutes}分</div>`;
            }
          }
        }
      }

      html += '</section>';
    }

    if (!html) {
      html = `<div class="empty">${selectedStudent ? '該当する予定はありません。' : '生徒名を入力すると、その生徒の時間割を表示します。'}</div>`;
    }

    $('schedule').innerHTML = html;
    document.dispatchEvent(new Event('student-selection-changed'));
    bindCards();
    updateStickyContext();

    $('status').textContent = '';
  }

  function bindCards() {
    document.querySelectorAll('.event-card').forEach(card => {
      card.addEventListener('click', (e) => { if(e.target.closest('[data-contact-open],[data-contact-history],.student-card-send-btn,.student-file-delete-btn,.student-sent-files a')) return; showDetail(card.dataset.key); });
    });
    document.querySelectorAll('.student-file-delete-btn').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        e.preventDefault(); e.stopPropagation();
        const key=btn.dataset.deleteKey||''; const id=btn.dataset.deleteId||'';
        if(!key||!id) return;
        if(!confirm('この送信済み資料を削除しますか？')) return;
        btn.disabled=true; btn.textContent='削除中…';
        try{
          await StudentAttachments.remove(key,id);
          await StudentAttachments.loadAll();
          render();
        }catch(err){
          alert('削除できませんでした：'+(err.message||err));
          btn.disabled=false; btn.textContent='削除';
        }
      });
    });
  }

  async function showDetail(key) {
    const original = rows.find(r => lessonRoomKey(r) === key);
    const target=LinkedSchedule.merge(renderedRows,lessonRoomKey,effectiveRoom).find(r=>lessonRoomKey(r)===key)||original;
    if (!target) return;
    const group = resolvePriorityConflicts(rows.filter(r=>!specialDayLabel(r)&&belongsToStudent(r)&&!isExemptForSelectedStudent(r))).filter(r=>r.cls===target.cls);
    const attachments=await StudentAttachments.list(key).catch(()=>[]);
    const detailNote=[...new Set((target._linked?.members||[target]).map(m=>SharedClassState.get(lessonRoomKey(m))?.publicNote||m.note||'').filter(Boolean))].join('\n');
    let detailHomework='';
    try{
      const timeline=[...rows.filter(r=>!specialDayLabel(r)&&r.cls===target.cls)].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
      const prevDates=[...new Set(timeline.map(r=>r.date).filter(d=>d&&d<target.date))].sort();
      const prevDate=prevDates.length?prevDates[prevDates.length-1]:'';
      if(prevDate){
        const homeworks=[];
        for(const prev of timeline.filter(r=>r.date===prevDate)){
          const rec=lessonRecords[lessonRoomKey(prev)]||{};
          const hw=String(rec.homework||'').trim();
          if(hw&&!homeworks.includes(hw)) homeworks.push(hw);
        }
        detailHomework=homeworks.join('\n');
      }
    }catch(e){}

    $('modalTitle').textContent = `${target.cls} ${studentType(target)}`;
    $('modalBody').innerHTML = `
      ${optionalNote(target)}
      ${selectedStudent?`<button type="button" class="ws-button sc-history-link" data-contact-history data-contact-keys="${esc(JSON.stringify((target._linked?.members||[target]).map(lessonRoomKey)))}">この授業の連絡を確認</button>`:''}
      ${selectedStudent&&target.date>=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'})?`<div class="sc-card-actions"><button type="button" class="sc-open" data-contact-open data-contact-keys="${esc(JSON.stringify((target._linked?.members||[target]).map(lessonRoomKey)))}">遅刻・欠席を連絡（β版）</button></div>`:''}
      <dl class="detail-list">
        <dt>担当講師</dt><dd>${esc(target.teacher || '-')}</dd>

        <dt>教室</dt><dd>${esc(target.room || '-')}</dd>
        <dt>時間</dt><dd>${esc(LinkedSchedule.label(target))} ${esc(target.start)}–${esc(target.end)}${target._linked?.mealBreak?'<p class="linked-meal-notice">途中で食事休憩が入ります</p>':''}</dd>
        <dt>先生から生徒へのメッセージ</dt><dd>${esc(detailNote || '-')}</dd>
      </dl>
      ${window.LessonFixed?(target._linked?.members||[target]).map(m=>`<span>${esc(m.slot)} ${LessonFixed.badge(lessonRoomKey(m))}</span>`).join(' '):''}${detailHomework?`<div class="detail-homework"><strong>📚 宿題</strong><br>${esc(detailHomework)}</div>`:''}
      ${attachments.length?`<div class="detail-attachments"><strong>📎 このコマの資料</strong>${attachments.map(a=>`<div class="student-detail-attachment"><a href="${StudentAttachments.rawUrl(a)}" download="${esc(a.name)}" target="_blank" rel="noopener"><span class="attachment-source">${a.sender==='student'?'生徒→先生':'先生→生徒'}</span>⬇ ${esc(a.name)}</a>${a.sender==='student'&&a.canDelete?`<button type="button" class="student-detail-delete-btn" data-delete-id="${esc(a.id)}">削除</button>`:''}</div>`).join('')}</div>`:''}
      <div class="student-send-box"><strong>📤 先生へ資料を送る</strong><div class="student-send-row"><input id="studentToTeacherFile" type="file" multiple><button id="studentToTeacherUpload" class="student-send-btn" type="button">送信</button></div><small id="studentToTeacherStatus" class="student-send-status"></small></div>
      <div class="schedule-list"><strong>この授業のスケジュール</strong>
        ${group.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(r =>
          `<div class="schedule-item">${esc(r.date)}（${dayName(r.date)}）　${esc(r.slot)} ${esc(r.start)}–${esc(r.end)}　${esc(r.room)}</div>`
        ).join('')}
      </div>`;
    $('modal').classList.remove('hidden');
    const sendBtn=document.getElementById('studentToTeacherUpload');
    const sendInput=document.getElementById('studentToTeacherFile');
    const sendStatus=document.getElementById('studentToTeacherStatus');
    document.querySelectorAll('.student-detail-delete-btn').forEach(btn=>{
      btn.onclick=async()=>{
        const id=btn.dataset.deleteId||''; if(!id) return;
        if(!confirm('この送信済み資料を削除しますか？')) return;
        btn.disabled=true; btn.textContent='削除中…';
        try{
          await StudentAttachments.remove(key,id);
          await StudentAttachments.loadAll();
          await showDetail(key);
          render();
        }catch(e){ alert('削除できませんでした：'+(e.message||e)); btn.disabled=false; btn.textContent='削除'; }
      };
    });
    if(sendBtn&&sendInput){
      sendBtn.onclick=async()=>{
        const files=[...sendInput.files];
        if(!files.length){ if(sendStatus) sendStatus.textContent='ファイルを選択してください。'; return; }
        sendBtn.disabled=true; sendBtn.textContent='送信中…'; if(sendStatus) sendStatus.textContent='';
        try{
          for(const f of files) await StudentAttachments.upload(key,f,{sender:'student',senderName:selectedStudent?.name||''});
          sendInput.value=''; if(sendStatus) sendStatus.textContent='✓ 先生へ送信しました';
          await StudentAttachments.loadAll();
          setTimeout(()=>showDetail(key),250);
        }catch(e){ if(sendStatus) sendStatus.textContent='送信失敗：'+(e.message||e); }
        finally{ sendBtn.disabled=false; sendBtn.textContent='送信'; }
      };
    }
  }

  async function searchStudent() {
    if(window.StudentSchedule&&!await StudentSchedule.ready)return;
    await loadRoomOverrideCache();
    await SharedClassState.loadAll();
    try{ await StudentAttachments.loadAll(); }catch(e){ console.warn('添付ファイル読込失敗',e); }
    const typed = selectedStudent?.name || $('studentName').value.trim();
    if (!typed) {
      selectedStudent = null;
      $('studentMessage').textContent = '氏名を入力してください。';
      render();
      return;
    }

    const found = students.find(s => normName(s.name) === normName(typed));
    if (!found) {
      selectedStudent = null;
      $('studentMessage').textContent = '登録されている生徒名が見つかりません。';
      render();
      return;
    }

    selectedStudent = found;
    $('studentName').value = found.name;
    $('studentName').readOnly = true;
    $('studentSearch').disabled = true;
    $('studentMessage').textContent = '';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function updateStickyContext() {
    const groups = [...document.querySelectorAll('.day-group')];
    if (!groups.length) {
      $('stickyDate').textContent = '日付';
      $('stickyTime').textContent = '時間';
      return;
    }

    const y = 48;
    let current = groups[0];
    for (const g of groups) {
      const r = g.getBoundingClientRect();
      if (r.top <= y) current = g;
      else break;
    }

    const date = current.dataset.date || '';
    $('stickyDate').textContent = date ? `${date.slice(5).replace('-','/')}（${dayName(date)}）` : '日付';

    const cards = [...current.querySelectorAll('.event-card')];
    let currentCard = cards[0] || null;
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      if (r.top <= 92) currentCard = c;
      else break;
    }
    $('stickyTime').textContent = currentCard?.dataset.time || '時間';
  }


  async function loadRoomOverrideCache(){
    roomOverrideCache={};
    try{
      const res=await fetch('room_override_api.php?v='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json=await res.json();

      if(json && json.ok && json.overrides && typeof json.overrides==='object'){
        roomOverrideCache=json.overrides;
      }
    }catch(e){
      console.warn('教室変更データを読み込めませんでした',e);
      roomOverrideCache={};
    }
  }

  async function loadData() {
    try {
      if(window.Workspace)await Workspace.ready;if(window.LessonGroups)await LessonGroups.ready;
      if(window.SchoolHolidays) await SchoolHolidays.load();
      const xlsxRes = await fetch(FILE + '?v=' + Date.now(), {cache:'no-store'});
      if (!xlsxRes.ok) throw new Error('schedule.xlsx が見つかりません');

      const buf = await xlsxRes.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});

      const ws = wb.Sheets['時間割データ'] || wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {defval:''}).map(normalizeRow).filter(r => r.date);
      await loadRoomOverrideCache();

      const studentWs = wb.Sheets['生徒マスタ'];
      if (!studentWs) throw new Error('schedule.xlsx に「生徒マスタ」シートがありません');

      const memberRows = XLSX.utils.sheet_to_json(studentWs, {defval:''});
      const grouped = new Map();

      studentMembershipPriority = {};

      memberRows.forEach(r => {
        const name = String(r['生徒名'] || '').trim();
        const cls = String(r['クラス'] || '').trim();
        const priority = Number(r['優先度'] || 0) || 0;
        if (!name || !cls || (window.Workspace&&Workspace.hiddenStudent(name)&&!managementPreview())) return;

        const key = normName(name);
        if (!grouped.has(key)) grouped.set(key, {name, classes:[]});
        const item = grouped.get(key);
        if (!item.classes.includes(cls)) item.classes.push(cls);

        if (!studentMembershipPriority[key]) studentMembershipPriority[key] = {};
        studentMembershipPriority[key][cls] = priority;
      });

      students = [...grouped.values()];
      await SharedClassState.loadAll();
      try{const lr=await (await fetch('lesson_record_api.php?action=homework&v='+Date.now(),{cache:'no-store'})).json();lessonRecords=(lr&&lr.records)||{};}catch(e){console.warn('宿題データ読込失敗',e);lessonRecords={};}

      render();
      return true;
    } catch (e) {
      console.error(e);
      $('status').textContent = '読込エラー：' + (e.message || e);
      $('schedule').innerHTML = `<div class="empty">時間割データを読み込めませんでした。</div>`;
      return false;
    }
  }

  $('studentSearch').addEventListener('click', () => { searchStudent(); });
  $('studentName').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode!==229) { e.preventDefault(); searchStudent(); }
  });

  $('modalClose').addEventListener('click', () => $('modal').classList.add('hidden'));
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.add('hidden'); });

  let scrollTick = false;
  window.addEventListener('scroll', () => {
    if (scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(() => {
      updateStickyContext();
      scrollTick = false;
    });
  }, {passive:true});

  window.StudentSchedule={ready:loadData(),search:searchStudent,getStudentName:()=>selectedStudent?.name||'',render};
  document.addEventListener('history-window-change',()=>{if(rows.length)render();});
})();
</script>




<script>
(function(){
  let showPast=false;
  let nowTimer=null;

  function parseIsoDate(v){
    if(!v) return null;
    const d=new Date(v+'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }

  function setupPastToggle(){
    if(document.getElementById('studentPastToggle')) return;

    const target=document.getElementById('studentExtraTools');
    const wrap=document.createElement('div');
    wrap.className='student-past-toggle-wrap';
    wrap.innerHTML='<label class="student-past-toggle-label"><input id="studentPastToggle" type="checkbox"><span>終了した日も表示</span></label>';

    if(target && target.parentNode){
      target.appendChild(wrap);
    }else{
      document.querySelector('.app')?.prepend(wrap);
    }

    wrap.querySelector('input').addEventListener('change',e=>{
      showPast=e.target.checked;
      applyPastVisibility();
      drawNowLine();
    });
  }

  function applyPastVisibility(){
    const today=new Date();
    today.setHours(0,0,0,0);

    document.querySelectorAll('.day-group[data-date]').forEach(group=>{
      const d=parseIsoDate(group.dataset.date);
      const hide=window.HistoryWindow?!HistoryWindow.includes(d?d.toLocaleDateString('sv-SE'):''):!!(d&&d<today&&!showPast);
      group.classList.toggle('hidden-past-day',hide);
    });
  }

  function toMinutes(hm){
    const m=String(hm||'').match(/(\d{1,2}):(\d{2})/);
    return m ? Number(m[1])*60+Number(m[2]) : null;
  }

  function drawNowLine(){
    // Local DOM only. No fetch/API call.
    document.querySelectorAll('.student-now-line').forEach(x=>x.remove());

    const now=new Date();
    const todayIso=[
      now.getFullYear(),
      String(now.getMonth()+1).padStart(2,'0'),
      String(now.getDate()).padStart(2,'0')
    ].join('-');

    const group=document.querySelector('.day-group[data-date="'+todayIso+'"]');
    if(!group || group.classList.contains('hidden-past-day')) return;

    const cur=now.getHours()*60+now.getMinutes();
    const cards=Array.from(group.querySelectorAll('.event-card[data-time]'));
    if(!cards.length) return;

    const timedCards=cards.map(card=>{
      const parts=(card.dataset.time||'').split('-');
      return {card,start:toMinutes(parts[0]),end:toMinutes(parts[1])};
    }).filter(x=>x.start!==null).sort((a,b)=>a.start-b.start);

    let activeItem=null;
    let beforeCard=null;
    for(const item of timedCards){
      if(item.end!==null && cur>=item.start && cur<item.end){
        activeItem=item;
        break;
      }
      if(item.start>cur){
        beforeCard=item.card;
        break;
      }
    }

    const line=document.createElement('div');
    line.className='student-now-line';

    const label=document.createElement('span');
    label.className='student-now-line-label';
    label.textContent='現在 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    line.appendChild(label);

    if(activeItem){
      const duration=Math.max(1,activeItem.end-activeItem.start);
      const ratio=Math.max(0,Math.min(1,(cur-activeItem.start)/duration));
      line.style.position='absolute';
      line.style.left='0';
      line.style.right='0';
      line.style.width='auto';
      line.style.margin='0';
      line.style.top=(ratio*100)+'%';
      activeItem.card.appendChild(line);
    }else if(beforeCard){
      group.insertBefore(line,beforeCard);
    }else{
      const last=(timedCards[timedCards.length-1]||{}).card || cards[cards.length-1];
      if(last.nextSibling){
        group.insertBefore(line,last.nextSibling);
      }else{
        group.appendChild(line);
      }
    }
  }

  function updateLessonCountdowns(){
    const now=new Date();
    document.querySelectorAll('.event-card[data-date][data-time]').forEach(card=>{
      const out=card.querySelector('[data-countdown]');
      if(!out) return;
      const parts=(card.dataset.time||'').split('-');
      const startText=parts[0]||'';
      const endText=parts[1]||'';
      const sm=startText.match(/(\d{1,2}):(\d{2})/);
      const em=endText.match(/(\d{1,2}):(\d{2})/);
      if(!sm || !em || !card.dataset.date){ out.textContent=''; return; }
      const start=new Date(card.dataset.date+'T'+String(sm[1]).padStart(2,'0')+':'+sm[2]+':00');
      const end=new Date(card.dataset.date+'T'+String(em[1]).padStart(2,'0')+':'+em[2]+':00');
      out.classList.remove('is-soon','is-active','is-ended');
      if(now<start){
        const mins=Math.max(0,Math.ceil((start-now)/60000));
        const days=Math.floor(mins/1440);
        const hours=Math.floor((mins%1440)/60);
        const minutes=mins%60;
        out.textContent=days>0 ? `あと${days}日${hours}時間${minutes}分でこのコマが始まります` : `あと${hours}時間${minutes}分でこのコマが始まります`;
        if(mins<=30) out.classList.add('is-soon');
      }else if(now<end){
        const mins=Math.max(0,Math.ceil((end-now)/60000));
        out.textContent=`授業中（残り${mins}分）`;
        out.classList.add('is-active');
      }else{
        out.textContent='終了しました';
        out.classList.add('is-ended');
      }
    });
  }

  function refreshStudentTimeUi(){
    applyPastVisibility();
    drawNowLine();
    updateLessonCountdowns();
  }

  function init(){
    setupPastToggle();

    // Wait for Excel-based schedule rendering, then run a few one-shot passes.
    setTimeout(refreshStudentTimeUi,700);
    setTimeout(refreshStudentTimeUi,1600);
    setTimeout(refreshStudentTimeUi,3000);

    if(nowTimer) clearInterval(nowTimer);
    nowTimer=setInterval(()=>{drawNowLine();updateLessonCountdowns();},15000);

    window.addEventListener('resize',drawNowLine,{passive:true});

    // Reapply only after user actions that can rerender the schedule.
    document.getElementById('studentSearch')?.addEventListener('click',()=>setTimeout(refreshStudentTimeUi,100));
    document.getElementById('studentName')?.addEventListener('keydown',e=>{
      if(e.key==='Enter') setTimeout(refreshStudentTimeUi,100);
    });

    ['classFilter','teacherFilter','roomFilter','typeFilter'].forEach(id=>{
      document.getElementById(id)?.addEventListener('change',()=>setTimeout(refreshStudentTimeUi,100));
    });
    document.getElementById('clearFilters')?.addEventListener('click',()=>setTimeout(refreshStudentTimeUi,100));
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    init();
  }
window.applyPastVisibility=applyPastVisibility;window.drawNowLine=drawNowLine;document.addEventListener('history-window-change',()=>{applyPastVisibility();drawNowLine();});
})();
</script>

<script id="student-nowline-fix-v1">
(function(){
  function hhmmToMin(v){
    if(!v) return null;
    var m=String(v).match(/(\d{1,2}):(\d{2})/);
    return m ? (+m[1])*60+(+m[2]) : null;
  }
  function ymdLocal(){
    var d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function updateStudentNowLine(){
    document.querySelectorAll('.student-nowline').forEach(function(x){x.remove();});
    var now=new Date(), nowMin=now.getHours()*60+now.getMinutes(), today=ymdLocal();
    var cards=[].slice.call(document.querySelectorAll('[data-date][data-start][data-end], .lesson-card, .lesson'));
    cards.forEach(function(card){
      var date=card.getAttribute('data-date')||card.dataset.date||'';
      if(date && date.replace(/\//g,'-')!==today) return;
      var st=card.getAttribute('data-start')||card.dataset.start;
      var en=card.getAttribute('data-end')||card.dataset.end;
      if(!st||!en){
        var txt=card.textContent||'';
        var mm=txt.match(/(\d{1,2}:\d{2})\s*[〜~\-–]\s*(\d{1,2}:\d{2})/);
        if(mm){ st=mm[1]; en=mm[2]; }
      }
      var a=hhmmToMin(st), b=hhmmToMin(en);
      if(a==null||b==null||nowMin<a||nowMin>b) return;
      var target=card.querySelector('.lesson-card-body,.card-body,.content')||card;
      if(getComputedStyle(target).position==='static') target.style.position='relative';
      var line=document.createElement('div'); line.className='student-nowline';
      var pct=(nowMin-a)/Math.max(1,b-a)*100;
      line.style.top=Math.max(0,Math.min(100,pct))+'%';
      target.appendChild(line);
    });
  }
  window.addEventListener('load',function(){ setTimeout(updateStudentNowLine,300); setInterval(updateStudentNowLine,30000); });
})();
</script>

<script id="student-confirm-fullschedule-v49">
(function(){
  'use strict';

  function revealAllSchedule(){
    document.querySelectorAll('.day-group.student-future-hidden').forEach(function(g){
      g.classList.remove('student-future-hidden');
    });
    var oldWrap=document.getElementById('studentFutureMoreWrap');

    try{
      if(typeof window.applyStudentAttachments==='function') setTimeout(window.applyStudentAttachments,100);
    }catch(e){}
  }

  async function showConfirmOnce(){
    await StaffAuth.ready;if(StaffAuth.user){revealAllSchedule();return;}
    if(document.getElementById('studentConfirmOverlay')) return;
    var ov=document.createElement('div');
    ov.id='studentConfirmOverlay';
    var cd='';
    try{ if(window.ScheduleConfirmed) cd=await ScheduleConfirmed.load(true); }catch(e){ console.error('確定日の読込に失敗',e); }
    var btnText='確定・仮予定を確認してスケジュールを表示'; ov.innerHTML='<div id="studentConfirmBox" role="dialog" aria-modal="true"><div class="msg">「🔒 確定」の授業は、現在の確定した予定です。<br>それ以外は追加・変更・取消の可能性があります。<br>当日の朝にも確認してください。</div><button id="studentConfirmOk" type="button">'+btnText+'</button></div>';
    document.body.appendChild(ov);
    var ok=document.getElementById('studentConfirmOk');
    if(ok) ok.focus({preventScroll:true});
    if(ok) ok.addEventListener('click',function(){
      revealAllSchedule();
      if(ov.parentNode) ov.parentNode.removeChild(ov);
      if(!window.StudentSchedule?.getStudentName())document.getElementById('studentName')?.focus({preventScroll:true});
    },{once:true});
  }

  function keepAllVisible(){
    revealAllSchedule();
  }

  function init(){
    // 旧「1週間だけ表示」仕様を廃止。確認後は決まっている予定を全日程表示する。
    revealAllSchedule();
    setTimeout(showConfirmOnce,120);

    var schedule=document.getElementById('schedule');
    if(schedule && window.MutationObserver){
      new MutationObserver(function(){ setTimeout(keepAllVisible,30); }).observe(schedule,{childList:true,subtree:false});
    }

    ['studentSearch','clearFilters'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.addEventListener('click',function(){setTimeout(keepAllVisible,120);});
    });
    var name=document.getElementById('studentName');
    if(name) name.addEventListener('keydown',function(e){if(e.key==='Enter')setTimeout(keepAllVisible,120);});
    ['classFilter','teacherFilter','roomFilter','typeFilter'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.addEventListener('change',function(){setTimeout(keepAllVisible,120);});
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>


<script id="student-attachment-render-v44">

          }else badge.textContent='📎 '+items.length;

        }else{ if(box)box.remove(); if(badge)badge.remove(); }
      });

})();
</script>
