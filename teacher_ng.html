<!doctype html><html lang="ja"><head><script src="staff-auth.js?v=20260917-r56-ready" data-staff="required"></script><script src="workspace-ui.js?v=20260916-r54-ready"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講師NG管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#18222d}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid #dce2e8;position:sticky;top:0;z-index:5}.top h1{font-size:20px;margin:0}.top a{color:#1565c0;text-decoration:none}.wrap{max-width:1100px;margin:18px auto;padding:0 14px}.panel{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0000000a}.grid{display:grid;grid-template-columns:1.2fr 180px 1fr;gap:12px;align-items:end}label{font-weight:700;font-size:13px;display:block}select,input{width:100%;margin-top:5px;border:1px solid #cbd4dd;border-radius:8px;padding:9px;background:#fff}.allday{display:flex;align-items:center;gap:7px;margin-top:10px}.allday input{width:auto;margin:0}.slots{display:grid;grid-template-columns:repeat(11,minmax(58px,1fr));gap:6px;margin:12px 0}.slot{border:1px solid #ccd5df;border-radius:8px;padding:8px 4px;text-align:center;background:#fafbfc;font-weight:700}.slot input{width:auto;margin:0 4px 0 0}.actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer}.primary{background:#1565c0;color:white}.danger{background:#fff1f1;color:#a31818;border:1px solid #f1caca}.msg{font-size:13px}.batch{display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px;align-items:end}.batch-note{min-width:160px}.batch-help{font-size:12px;color:#647382;margin-top:7px}.multi-calendar-wrap{margin-top:12px;border:1px solid #d8e0e8;border-radius:10px;overflow:hidden;max-width:560px}.multi-calendar-head{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:#f8fafc;border-bottom:1px solid #e2e8f0}.cal-nav{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font-weight:800}.cal-title{font-weight:900}.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-week div{text-align:center;padding:6px 2px;font-size:11px;font-weight:800;color:#64748b;background:#fbfcfd}.cal-day{min-height:52px;border:0;border-top:1px solid #eef2f7;border-right:1px solid #eef2f7;background:#fff;cursor:pointer;font-weight:800;position:relative}.cal-day:nth-child(7n){border-right:0}.cal-day.other{color:#b8c0c8;background:#fafbfc}.cal-day.selected{background:#fee2e2;color:#991b1b;box-shadow:inset 0 0 0 2px #ef4444}.cal-day.today::after{content:"今日";position:absolute;right:3px;bottom:2px;font-size:9px;color:#2563eb}.selected-days{margin-top:9px;font-size:13px;font-weight:700}.selected-days .count{color:#b91c1c}.selected-list{margin-top:5px;font-size:12px;color:#475569;line-height:1.7}.batch-controls{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.secondary{background:#eef2f7;color:#334155}.filter{display:flex;gap:10px;align-items:end}.filter>*{flex:1}.list table{width:100%;border-collapse:collapse}.list th,.list td{border-bottom:1px solid #e5e9ee;padding:9px;text-align:left}.badge{display:inline-block;background:#fff3cd;border:1px solid #f2d889;padding:3px 7px;border-radius:999px;font-weight:700}.muted{color:#647382}.empty{padding:22px;text-align:center;color:#647382}@media(max-width:760px){.grid,.batch{grid-template-columns:1fr}.slots{grid-template-columns:repeat(4,1fr)}.filter{flex-direction:column;align-items:stretch}}
</style><link rel="stylesheet" href="workspace-ui.css?v=20260912-r24"></head><body>
<div class="top"><h1>講師NG管理</h1><div><a href="schedule_generator.html" data-admin>コマ生成へ戻る</a>　<a href="teacher2026summer.html">全体スケへ戻る</a></div></div>
<div class="wrap">
<div class="panel"><div class="grid"><label>講師<select id="teacher"><option value="">選択してください</option></select></label><label>NG日<div style="display:flex;align-items:center;gap:8px"><input type="date" id="date"><strong id="dateWeekday" style="min-width:28px"></strong></div></label><label>メモ（任意）<input id="note" placeholder="例：大学・私用"></label></div>
<label class="allday"><input type="checkbox" id="allDay">終日NG</label>
<div class="slots" id="slots"></div><div class="actions"><button class="btn primary" id="save">NGを登録・更新</button><span class="msg" id="msg"></span></div></div>
<div class="panel"><h2 style="font-size:17px;margin:0 0 8px">終日NGを複数日一括登録</h2><div class="batch-help">カレンダーでNGにしたい日を好きなだけクリックしてください。連続していない日でもまとめて登録できます。</div><div class="batch"><label>講師<select id="batchTeacher"><option value="">選択してください</option></select></label><label class="batch-note">メモ（選択した全日に共通）<input id="batchNote" placeholder="例：大学・帰省・私用"></label><button class="btn primary" id="batchSave">選択日を一括NG</button></div><div class="multi-calendar-wrap"><div class="multi-calendar-head"><button type="button" class="cal-nav" id="calPrev">‹</button><div class="cal-title" id="calTitle"></div><button type="button" class="cal-nav" id="calNext">›</button></div><div class="cal-week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="cal-grid" id="calGrid"></div></div><div class="batch-controls"><button type="button" class="btn secondary" id="clearSelected">選択解除</button><span class="selected-days" id="selectedDays"></span></div><div class="selected-list" id="selectedList"></div><div class="msg" id="batchMsg" style="margin-top:8px"></div></div>
<div class="panel filter"><label>講師で絞る<select id="filterTeacher"><option value="">すべて</option></select></label><label>日付以降<div style="display:flex;align-items:center;gap:8px"><input type="date" id="filterDate"><strong id="filterDateWeekday" style="min-width:28px"></strong></div></label><button class="btn" id="clear">絞り込み解除</button></div>
<div class="panel list"><table><thead><tr><th>日付</th><th>講師</th><th>NG</th><th>メモ</th><th></th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" hidden>NG登録はありません。</div></div>
</div>
<script>
const SLOTS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪']; let entries=[]; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('slots').innerHTML=SLOTS.map(s=>`<label class="slot"><input type="checkbox" value="${s}">${s}</label>`).join('');
$('date').value=new Date().toLocaleDateString('sv-SE'); $('filterDate').value=new Date().toLocaleDateString('sv-SE');
function weekday(v){if(!v)return '';const d=new Date(v+'T00:00:00');return isNaN(d)?'':['日','月','火','水','木','金','土'][d.getDay()]+'曜';}
function updateWeekdays(){$('dateWeekday').textContent=weekday($('date').value);$('filterDateWeekday').textContent=weekday($('filterDate').value);}
$('date').addEventListener('change',updateWeekdays);$('filterDate').addEventListener('change',updateWeekdays);updateWeekdays();
$('allDay').onchange=()=>document.querySelectorAll('#slots input').forEach(x=>{x.disabled=$('allDay').checked;if($('allDay').checked)x.checked=false});
async function loadTeachers(){try{const r=await fetch('data_api.php?v='+Date.now(),{cache:'no-store'});const j=await r.json();const a=[...new Set((j.schedule||[]).map(x=>String(x['担当講師']||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));for(const id of ['teacher','filterTeacher','batchTeacher']){const el=$(id);for(const t of a){const o=document.createElement('option');o.value=o.textContent=t;el.appendChild(o)}}}catch(e){}}
async function load(){const r=await fetch('teacher_ng_api.php?v='+Date.now(),{cache:'no-store'});const j=await r.json();entries=j.entries||[];render()}
function render(){const ft=$('filterTeacher').value,fd=$('filterDate').value;const a=entries.filter(e=>(!ft||e.teacher===ft)&&(!fd||e.date>=fd));$('tbody').innerHTML=a.map(e=>`<tr><td><strong>${esc(e.date)}（${weekday(e.date)}）</strong></td><td>${esc(e.teacher)}</td><td><span class="badge">${e.allDay?'終日':esc((e.slots||[]).join('・'))}</span></td><td>${esc(e.note||'')}</td><td><button class="btn danger" data-del="${esc(e.id)}">削除</button></td></tr>`).join('');$('empty').hidden=a.length>0;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('このNG設定を削除しますか？'))return;await fetch('teacher_ng_api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:b.dataset.del})});await load()})}
$('save').onclick=async()=>{const teacher=$('teacher').value,date=$('date').value,note=$('note').value.trim(),allDay=$('allDay').checked,slots=[...document.querySelectorAll('#slots input:checked')].map(x=>x.value);$('msg').textContent='保存中…';try{const r=await fetch('teacher_ng_api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',teacher,date,note,allDay,slots})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'保存失敗');$('msg').textContent='保存しました';entries=j.entries||[];render()}catch(e){$('msg').textContent='保存失敗：'+e.message}}

const selectedDates=new Set();
let calCursor=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})();
function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function renderCalendar(){
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  $('calTitle').textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  const today=new Date().toLocaleDateString('sv-SE'); let html='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoLocal(d);const other=d.getMonth()!==m;
    html+=`<button type="button" class="cal-day${other?' other':''}${selectedDates.has(iso)?' selected':''}${iso===today?' today':''}" data-cal-date="${iso}">${d.getDate()}</button>`;
  }
  $('calGrid').innerHTML=html;
  document.querySelectorAll('[data-cal-date]').forEach(b=>b.onclick=()=>{const iso=b.dataset.calDate;if(selectedDates.has(iso))selectedDates.delete(iso);else selectedDates.add(iso);renderCalendar();renderSelectedDays();});
}
function renderSelectedDays(){const a=[...selectedDates].sort();$('selectedDays').innerHTML=a.length?`選択中：<span class="count">${a.length}日</span>`:'選択中：0日';$('selectedList').textContent=a.map(d=>`${d.replaceAll('-','/')}（${weekday(d)}）`).join('　');}
$('calPrev').onclick=()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);renderCalendar();};
$('calNext').onclick=()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);renderCalendar();};
$('clearSelected').onclick=()=>{selectedDates.clear();renderCalendar();renderSelectedDays();};
$('batchSave').onclick=async()=>{const teacher=$('batchTeacher').value,note=$('batchNote').value.trim(),dates=[...selectedDates].sort();if(!teacher||!dates.length){$('batchMsg').textContent='講師を選び、カレンダーでNG日を選択してください';return;}if(!confirm(`${teacher}先生の ${dates.length}日分を終日NGで一括登録しますか？`))return;$('batchMsg').textContent='保存中…';try{const r=await fetch('teacher_ng_api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'batch_dates',teacher,dates,note})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'保存失敗');entries=j.entries||[];render();$('batchMsg').textContent=`${j.count||dates.length}日分を終日NGで登録しました`;selectedDates.clear();renderCalendar();renderSelectedDays();}catch(e){$('batchMsg').textContent='保存失敗：'+e.message}};
renderCalendar();renderSelectedDays();
$('filterTeacher').onchange=render;$('filterDate').onchange=render;$('clear').onclick=()=>{$('filterTeacher').value='';$('filterDate').value='';render()};
loadTeachers();load();
</script></body></html>
