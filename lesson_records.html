let records=[],attendanceByKey={},visibleLimit=50;const attendancePending=new Set(),attendanceFailures=new Set();const reactionPending=new Set(); const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
let teacherToneRules=[];
function teacherTone(name){name=String(name||'').trim();const allowed=['tone-pink','tone-blue','tone-orange','tone-yellow','tone-lime','tone-purple','tone-gray'];for(const rule of teacherToneRules){if(!rule||typeof rule.name!=='string'||!rule.name||!allowed.includes(rule.tone))continue;if(rule.match==='exact'&&name===rule.name||rule.match==='prefix'&&name.startsWith(rule.name))return rule.tone;}return 'tone-gray'}
function recordByline(r){return `<div class="record-byline"><span class="speaker tone-gray"><span class="speaker-dot" aria-hidden="true">👤</span>記録作成：${esc(r.author||'未記録')}</span>${r.editedBy||r.updatedBy?`<span class="record-editor">最終編集：${esc(r.editedBy||r.updatedBy)}</span>`:''}</div>`}
function formatDateTime(v){return KarteUI.dateTimeLabel(v)}

const viewerEl=document.getElementById('viewer');
function viewerName(){return window.StaffAuth?.user?.name||''} function withViewer(url){const u=new URL(url,location.href); if(viewerName())u.searchParams.set('viewer',viewerName()); return u.pathname.split('/').pop()+u.search;}
function classUrl(cls){const u=new URL('lesson_records.html',location.href);for(const name of (Array.isArray(cls)?cls:cls?[cls]:[]))u.searchParams.append('class',name);for(const id of ['q','date','teacher']){const value=document.getElementById(id).value;if(value)u.searchParams.set(id,value);}if(viewerName())u.searchParams.set('viewer',viewerName());return u.pathname.split('/').pop()+u.search}
function detailUrl(r){if(r.groupId)return 'lesson_group.html?v=20260916-r53&id='+encodeURIComponent(r.groupId);const u=new URL(r.teacher?'teacher2026summer_vertical.html':'teacher2026summer.html',location.href);if(r.teacher)u.searchParams.set('teacher',r.teacher);u.searchParams.set('openKey',r.eventKey||'');u.searchParams.set('linkedDate',String(r.date||'').replaceAll('/','-'));u.searchParams.set('date',String(r.date||'').replaceAll('/','-'));return u.pathname.split('/').pop()+u.search}
function render(){const openConversations=new Set([...document.querySelectorAll('.record-conversation[open]')].map(el=>el.closest('.card').dataset.key));const back=document.querySelector('.wrap>a.ws-button');if(back)document.querySelector('.top-actions').prepend(back);const q=document.getElementById('q').value.trim().toLowerCase(),d=document.getElementById('date').value,t=document.getElementById('teacher').value;let a=RecordTeacherNotes.entries(records).filter(r=>RecordHistory.includes(r)&&(!selectedClasses.size||selectedClasses.has(RecordTeacherNotes.className(r.className)))&&(!t||RecordTeacherNotes.teachers(r).includes(t))&&(r.kind!=='teacher-note'||!r.done||document.getElementById('recordNotesDone').checked)&&(!q||[RecordTeacherNotes.className(r.className),r.className,r.teacher,r.author,r.editedBy,r.updatedBy,r.memo,r.text,...(r.assigneeNames||[]),r.subject,r.room,(r.replies||[]).map(x=>x.text).join(' ')].join(' ').toLowerCase().includes(q)));a.sort(RecordHistory.sort);RecordHistory.update();document.getElementById('count').textContent=`${a.length}件（カルテ ${a.filter(r=>r.kind!=='teacher-note').length}件・連絡 ${a.filter(r=>r.kind==='teacher-note').length}件）${a.length>visibleLimit?'／'+visibleLimit+'件表示中':''}`;document.getElementById('recordsMore').hidden=a.length<=visibleLimit;document.getElementById('list').innerHTML=a.length?a.slice(0,visibleLimit).map(r=>{if(r.kind==='teacher-note')return RecordTeacherNotes.card(r);const reads=Object.keys(r.reads||{});const mine=viewerName()&&reads.includes(viewerName());const reps=Array.isArray(r.replies)?r.replies:[];return `<article class="card ${teacherTone(r.teacher)}" data-key="${esc(r.eventKey)}"><div class="meta"><span class="chip" data-record-date="${esc(r.date)}">📅 ${esc(KarteUI.dateLabel(r.date))}</span><span class="chip">🕒 ${esc(r.slot)}</span>${r.teacher?`<span class="chip record-teacher">👤 担当講師：${esc(r.teacher)}</span>`:''}${r.room?`<span class="chip">🏫 ${esc(r.room)}</span>`:''}</div><div class="record-heading"><button type="button" class="classLink" data-class="${esc(r.className||'授業')}">${esc(r.className||'授業')}</button></div>${recordByline(r)}<div class="record-content-label">授業カルテ</div><div class="memo ${teacherTone(r.teacher)}">${KarteUI.linkedText(r.memo)}</div>${String(r.homework||'').trim()?`<div class="homework"><strong>📚 次回までの宿題</strong>${esc(r.homework)}</div>`:''}<section class="record-attendance" data-attendance-key="${esc(r.eventKey)}">${KarteUI.attendanceHtml(attendanceByKey[r.eventKey])}</section><div class="editBox"><label style="font-weight:900">カルテ本文</label><textarea class="editMemo">${esc(r.memo)}</textarea><label class="editHomeworkLabel">📚 次回までの宿題</label><textarea class="editHomework" data-homework-items data-homework-task-refs="${esc(JSON.stringify(r.homeworkTaskRefs?.next||[]))}" placeholder="宿題がない日は「宿題なし」と記入">${esc(r.homework||'')}</textarea><button type="button" class="ws-button" data-homework-none=".editHomework">宿題なしを入力</button><div class="editActions"><button type="button" class="editSaveBtn">保存</button><button type="button" class="editCancelBtn">キャンセル</button></div></div><div class="updated" data-record-time="${esc(r.updatedAt||'')}" data-record-time-label="更新：">更新：${esc(formatDateTime(r.updatedAt||''))}</div><details class="record-conversation"><summary>返信・やりとり <span>${reps.length}件</span></summary><div class="replies">${reps.map(x=>`<div class="reply"><span class="avatar ${teacherTone(x.author)}">👤</span><div class="bubble ${teacherTone(x.author)}"><b>${esc(x.author||'先生')}</b><p>${esc(x.text||'')}</p>${x.createdAt?`<span class="reply-time" data-record-time="${esc(x.createdAt)}" data-record-time-label="送信：">送信：${esc(formatDateTime(x.createdAt))}</span>`:''}${KarteUI.reactionsHtml(r,x)}</div></div>`).join('')||'<small>返信はまだありません。</small>'}</div><div class="replyForm"><input placeholder="このカルテに返信" class="replyInput"><button type="button" class="replyBtn">返信</button></div></details><div class="cardActions"><button type="button" class="editBtn">✏️ 編集</button><button type="button" class="readBtn ${mine?'done':''}">${mine?'✓ よみました':'👀 よみました'}</button><a class="detailBtn" href="${esc(detailUrl(r))}" target="_blank" rel="noopener">この日の授業詳細へ</a><span class="reads">既読：${reads.length?esc(reads.join('・')):'まだありません'}</span></div></article>`}).join(''):'<div class="empty">該当するカルテはありません。先生への連絡も、現在の条件ではありません。</div>';document.querySelectorAll('.card').forEach(card=>{if(openConversations.has(card.dataset.key))card.querySelector('.record-conversation')?.setAttribute('open','');});loadVisibleAttendance();}
async function api(body){const r=await fetch('lesson_record_api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error||'保存に失敗しました');return j}
function loadProgress(text,done=null,total=null){document.getElementById('recordLoadingText').textContent=text;const bar=document.getElementById('recordProgress');bar.hidden=false;if(total>0&&done!==null){bar.value=done/total*100;bar.setAttribute('aria-valuetext',done+' / '+total+'件');}else{bar.removeAttribute('value');bar.removeAttribute('aria-valuetext');}}
async function readList(){loadProgress('カルテを取得中…（総件数は取得後に表示）');const response=await fetch('lesson_record_api.php?includeTiming=1&v='+Date.now(),{cache:'no-store'}),j=await response.json();if(!response.ok||!j.ok)throw new Error(j.error||'読み込みに失敗しました');return j;}
function updateAttendanceProgress(){const keys=[...document.querySelectorAll('[data-attendance-key]')].map(el=>el.dataset.attendanceKey),done=keys.filter(k=>Object.hasOwn(attendanceByKey,k)).length,total=keys.length,failed=keys.some(k=>attendanceFailures.has(k));document.getElementById('attendanceProgress').textContent=!total?'':failed?'一部の出欠を取得できませんでした（'+done+' / '+total+'件取得）。カルテは表示しています。':'表示中の出欠：'+done+' / '+total+'件（'+Math.floor(done/total*100)+'%）';}
async function loadVisibleAttendance(){
 const keys=[...document.querySelectorAll('[data-attendance-key]')].map(e=>e.dataset.attendanceKey),needed=keys.filter(k=>!Object.hasOwn(attendanceByKey,k)&&!attendancePending.has(k));updateAttendanceProgress();if(!needed.length)return;needed.forEach(k=>attendancePending.add(k));
 try{for(let i=0;i<needed.length;){let batch=[];while(i<needed.length&&batch.length<10){const next=[...batch,needed[i]];if(batch.length&&encodeURIComponent(JSON.stringify(next)).length>5500)break;batch=next;i++;}
 const response=await fetch('lesson_record_api.php?action=list_context&keys='+encodeURIComponent(JSON.stringify(batch)),{cache:'no-store'}),j=await response.json();if(!response.ok||!j.ok)throw new Error(j.error||'出欠の取得に失敗しました');
 for(const key of batch){attendanceByKey[key]=j.attendance?.[key]??null;attendancePending.delete(key);attendanceFailures.delete(key);document.querySelectorAll('[data-attendance-key]').forEach(el=>{if(el.dataset.attendanceKey===key)el.innerHTML=KarteUI.attendanceHtml(attendanceByKey[key]);});}updateAttendanceProgress();
 }}catch(e){needed.filter(k=>!Object.hasOwn(attendanceByKey,k)).forEach(k=>attendanceFailures.add(k));updateAttendanceProgress();}finally{needed.forEach(k=>attendancePending.delete(k));}
}
function updateClassChoices(){document.querySelectorAll('[data-record-class]').forEach(el=>el.checked=selectedClasses.has(el.value));document.getElementById('recordClassesClear').disabled=!selectedClasses.size;document.getElementById('recordClassCount').textContent=selectedClasses.size?selectedClasses.size+'授業を選択中':'選択なし：すべての授業を表示';document.getElementById('pageTitle').textContent=selectedClasses.size===1?[...selectedClasses][0]+' のカルテ一覧':selectedClasses.size?'選択した'+selectedClasses.size+'授業のカルテ一覧':'授業カルテ一覧';document.getElementById('classFilterNotice').textContent=selectedClasses.size?'表示対象：'+[...selectedClasses].join('・'):'';}
function refreshReactionViews(card,record){card.querySelectorAll('[data-reaction-target]').forEach(host=>{const id=host.dataset.reactionTarget,reply=id?(record.replies||[]).find(r=>r.id===id):null;if(id&&!reply)return;host.outerHTML=KarteUI.reactionsHtml(record,reply);});}
document.getElementById('list').addEventListener('click',async e=>{
 const button=e.target.closest('[data-reaction]');if(!button)return;const card=button.closest('.card'),key=card.dataset.key,replyId=button.dataset.replyId,chosen=button.dataset.reaction,expected=button.dataset.expected;
 if(reactionPending.has(key))return;reactionPending.add(key);card.querySelectorAll('[data-reaction]').forEach(b=>b.disabled=true);
 const getHost=()=>[...card.querySelectorAll('[data-reaction-target]')].find(h=>h.dataset.reactionTarget===replyId);
 getHost().querySelector('.karte-reaction-message').textContent='保存中…';let text='';
 try{const j=await api({action:'reaction',eventKey:key,replyId,emoji:expected===chosen?'':chosen,expected});const i=records.findIndex(r=>r.eventKey===key);if(i>=0)records[i]=j.record;refreshReactionViews(card,j.record);text=expected===chosen?'取り消しました。':'リアクションしました。';}
 catch(err){text=err.message;try{const response=await fetch('lesson_record_api.php?key='+encodeURIComponent(key),{cache:'no-store'}),j=await response.json();if(response.ok&&j.ok&&j.record?.eventKey){const i=records.findIndex(r=>r.eventKey===key);if(i>=0)records[i]=j.record;refreshReactionViews(card,j.record);}}catch(_){} }
 finally{reactionPending.delete(key);card.querySelectorAll('[data-reaction]').forEach(b=>b.disabled=false);const host=getHost();if(host){host.querySelector('.karte-reaction-message').textContent=text;if(document.activeElement===document.body)[...host.querySelectorAll('[data-reaction]')].find(b=>b.dataset.reaction===chosen)?.focus({preventScroll:true});}}
});
window.addEventListener('pageshow',e=>{if(e.persisted){attendanceByKey={};attendanceFailures.clear();attendancePending.clear();loadVisibleAttendance();}});

async function loadTeacherNotes(){
 const button=document.getElementById('recordNotesReload'),status=document.getElementById('recordNotesStatus');button.disabled=true;status.textContent='先生への連絡を取得中…';
 try{const count=await RecordTeacherNotes.read();status.textContent='先生への連絡 '+count+'件の読込完了';return true;}
 catch(e){status.textContent='先生への連絡を読み込めませんでした。カルテは引き続き表示します。連絡を再読み込みしてください。';return false;}
 finally{button.disabled=false;}
}
function refreshTimelineChoices(){
 selectedClasses=new Set([...selectedClasses].map(RecordTeacherNotes.className));const all=RecordTeacherNotes.entries(records);
 const classes=[...new Set(all.map(r=>RecordTeacherNotes.className(r.className)).filter(Boolean).concat([...selectedClasses]))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
 document.getElementById('recordClasses').innerHTML=classes.map(c=>`<label class="class-choice"><input type="checkbox" data-record-class value="${esc(c)}"><span>${esc(c)}</span></label>`).join('')||'<p>カルテ・連絡のある授業はありません。</p>';updateClassChoices();document.getElementById('recordClassSearch').dispatchEvent(new Event('input'));
 const ts=[...new Set(all.flatMap(RecordTeacherNotes.teachers))].sort((a,b)=>a.localeCompare(b,'ja')),select=document.getElementById('teacher'),current=select.value;
 select.innerHTML='<option value="">先生：すべて</option>'+ts.map(x=>`<option>${esc(x)}</option>`).join('');if(ts.includes(current))select.value=current;

}
document.getElementById('recordNotesDone').onchange=e=>{if((document.querySelector('.card.is-editing')||[...document.querySelectorAll('.replyInput')].some(el=>el.value.trim()))&&!confirm('入力中の内容を閉じて、連絡の表示を変更しますか？')){e.target.checked=!e.target.checked;return;}visibleLimit=50;render();};
function recordDraftSnapshot(){return JSON.stringify([...document.querySelectorAll('.card')].filter(card=>card.classList.contains('is-editing')||card.querySelector('.replyInput')?.value.trim()).map(card=>[card.dataset.key,...[...card.querySelectorAll('textarea,.replyInput')].map(input=>input.value)]));}
document.getElementById('recordNotesReload').onclick=async()=>{
 const draft=recordDraftSnapshot();if(draft!=='[]'&&!confirm('入力中の内容を閉じて、連絡を再読み込みしますか？'))return;
 if(await loadTeacherNotes()){if(recordDraftSnapshot()!=='[]'&&recordDraftSnapshot()!==draft){document.getElementById('recordNotesStatus').textContent+='。入力中の内容を保存してから、もう一度再読み込みしてください。';return;}refreshTimelineChoices();RecordHistory.setRecords(RecordTeacherNotes.entries(records));render();}
};

async function init(){try{
 const session=await window.StaffAuth.ready;teacherToneRules=Array.isArray(session.recordDisplay?.teacherToneRules)?session.recordDisplay.teacherToneRules:[];const [j]=await Promise.all([readList(),loadTeacherNotes()]),all=Object.values(j.records||{});records=[];
 for(let i=0;i<all.length;i+=250){records.push(...all.slice(i,i+250));loadProgress('カルテを準備中：'+records.length+' / '+all.length+'件（'+Math.floor(records.length/all.length*100)+'%）',records.length,all.length);await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)));}
 refreshTimelineChoices();
 RecordHistory.setTimings(j.timings);RecordHistory.setRecords(RecordTeacherNotes.entries(records));
 const ts=[...new Set(RecordTeacherNotes.entries(records).flatMap(RecordTeacherNotes.teachers))];
 const teacherPreset=params.get('teacher')||'';if(ts.includes(teacherPreset))document.getElementById('teacher').value=teacherPreset;document.getElementById('q').value=params.get('q')||'';const datePreset=params.get('date')||'';if(/^\d{4}-\d{2}-\d{2}$/.test(datePreset))document.getElementById('date').value=datePreset;
 loadProgress('カルテの表示を作成中…');await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)));render();document.getElementById('recordLoadingText').textContent='カルテ '+records.length+'件の読込完了';document.getElementById('recordProgress').hidden=true;
 }catch(e){document.getElementById('recordLoadingText').textContent='カルテを読み込めませんでした。再読込してください。';document.getElementById('recordProgress').hidden=true;document.getElementById('list').innerHTML='<div class="empty">読み込みに失敗しました。</div>';}}
function chooseClasses(next){if((document.querySelector('.card.is-editing')||[...document.querySelectorAll('.replyInput')].some(el=>el.value.trim()))&&!confirm('入力中の内容を閉じて、授業を切り替えますか？')){updateClassChoices();return;}selectedClasses=new Set(next.map(RecordTeacherNotes.className));visibleLimit=50;updateClassChoices();history.replaceState(null,'',classUrl([...selectedClasses])+location.hash);render();}
function chooseClass(cls){chooseClasses(cls?[cls]:[]);}
document.getElementById('recordClasses').onchange=()=>chooseClasses([...document.querySelectorAll('[data-record-class]:checked')].map(el=>el.value));document.getElementById('recordClassesClear').onclick=()=>chooseClasses([]);
document.getElementById('recordClassSearch').oninput=e=>{const q=e.target.value.trim().toLocaleLowerCase();document.querySelectorAll('.class-choice').forEach(el=>el.hidden=!el.textContent.toLocaleLowerCase().includes(q));};
document.getElementById('recordsMore').onclick=()=>{if(document.querySelector('.card.is-editing')||[...document.querySelectorAll('.replyInput')].some(el=>el.value.trim())){if(!confirm('入力中の内容を閉じて、次のカルテを表示しますか？'))return;}visibleLimit+=50;render();};
document.getElementById('todayRecords').onclick=()=>{document.getElementById('date').value=Workspace.today();document.querySelector('.records-filter').open=true;render();document.getElementById('list').scrollIntoView({block:'start'});};['q','date','teacher'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render)); viewerEl.addEventListener('change',()=>{localStorage.setItem('karteViewer',viewerName());render()});
document.getElementById('list').addEventListener('click',async e=>{const card=e.target.closest('.card');if(!card)return;const key=card.dataset.key;if(e.target.closest('.classLink')){chooseClass(e.target.closest('.classLink').dataset.class);return}if(e.target.closest('.editBtn')){card.classList.add('is-editing');const ta=card.querySelector('.editMemo');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}return}if(e.target.closest('.editCancelBtn')){card.classList.remove('is-editing');const r=records.find(x=>x.eventKey===key);const ta=card.querySelector('.editMemo');if(ta&&r)ta.value=r.memo||'';const hw=card.querySelector('.editHomework');if(hw&&r){hw.value=r.homework||'';window.HomeworkItemEditor?.bind(hw,r,'next');}return}if(e.target.closest('.editSaveBtn')){const ta=card.querySelector('.editMemo');const memo=(ta?.value||'').trim();if(!memo)return alert('カルテ本文を空欄にはできません。');const homework=card.querySelector('.editHomework')?.value||'';const btn=e.target.closest('.editSaveBtn');btn.disabled=true;btn.textContent='保存中…';try{const j=await api({action:'edit',eventKey:key,memo,homework,homeworkTaskRefs:window.HomeworkItemEditor?.refs({next:card.querySelector('.editHomework')}),expectedRevision:records.find(x=>x.eventKey===key)?._revision});const i=records.findIndex(x=>x.eventKey===key);if(i>=0)records[i]=j.record;render()}catch(err){alert(err.message);btn.disabled=false;btn.textContent='保存'}return}if(e.target.closest('.readBtn')){if(!viewerName())return alert('先生のアカウントでログインし直してください。');try{const j=await api({action:'read',eventKey:key,teacher:viewerName()});const i=records.findIndex(x=>x.eventKey===key);if(i>=0)records[i]=j.record;render()}catch(err){alert(err.message)}return}if(e.target.closest('.replyBtn')){if(!viewerName())return alert('先生のアカウントでログインし直してください。');const input=card.querySelector('.replyInput'),text=input.value.trim();if(!text)return;try{const j=await api({action:'reply',eventKey:key,author:viewerName(),text});const i=records.findIndex(x=>x.eventKey===key);if(i>=0)records[i]=j.record;render()}catch(err){alert(err.message)}}});
document.getElementById('backupBtn').addEventListener('click',async()=>{const b=document.getElementById('backupBtn'),m=document.getElementById('backupMsg');b.disabled=true;m.textContent='バックアップ作成中…';try{const j=await (await fetch('backup_api.php',{method:'POST'})).json();if(!j.ok)throw new Error(j.error||'失敗');m.innerHTML=j.url?('作成しました：<a href="'+esc(j.url)+'">'+esc(j.file)+' をダウンロード</a>'):('サーバー内に '+esc(j.snapshot||j.file)+' を作成しました。FTPで data/_system_backups/ から取得できます。');}catch(e){m.textContent=e.message}finally{b.disabled=false}});RecordHistory.install(render);init();

if(params.get('q')||params.get('teacher')||params.get('date'))document.querySelector('.records-filter').open=true;
