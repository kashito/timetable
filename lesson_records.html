tCancelBtn{background:#fff;color:#475569;border:1px solid #cbd5e1}.reads{font-size:12px;color:#64748b}.empty{text-align:center;padding:50px 15px;color:#64748b}.backupMsg{font-size:12px;color:#166534;font-weight:800}@media(max-width:700px){.filters{grid-template-columns:1fr}.wrap{padding:12px}.top h1{font-size:18px}.card{padding:12px}.replyForm{flex-direction:column}.viewer{align-items:flex-start;flex-direction:column}}

<script>
const params=new URLSearchParams(location.search); const targetClass=(params.get('class')||'').trim();
let records=[],attendanceByKey={};const reactionPending=new Set(); const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
let teacherToneRules=[];
function teacherTone(name){name=String(name||'').trim();const allowed=['tone-pink','tone-blue','tone-orange','tone-yellow','tone-lime','tone-purple','tone-gray'];for(const rule of teacherToneRules){if(!rule||typeof rule.name!=='string'||!rule.name||!allowed.includes(rule.tone))continue;if(rule.match==='exact'&&name===rule.name||rule.match==='prefix'&&name.startsWith(rule.name))return rule.tone;}return 'tone-gray'}
function recordByline(r){return `<div class="record-byline"><span class="speaker tone-gray"><span class="speaker-dot" aria-hidden="true">👤</span>記録作成：${esc(r.author||'未記録')}</span>${r.editedBy||r.updatedBy?`<span class="record-editor">最終編集：${esc(r.editedBy||r.updatedBy)}</span>`:''}</div>`}
function formatDateTime(v){return KarteUI.dateTimeLabel(v)}

const viewerEl=document.getElementById('viewer');
function viewerName(){return window.StaffAuth?.user?.name||''} function withViewer(url){const u=new URL(url,location.href); if(viewerName())u.searchParams.set('viewer',viewerName()); return u.pathname.split('/').pop()+u.search;}
function classUrl(cls){const u=new URL('lesson_records.html',location.href);u.searchParams.set('class',cls);if(viewerName())u.searchParams.set('viewer',viewerName());return u.pathname.split('/').pop()+u.search}
function detailUrl(r){if(r.groupId)return 'lesson_group.html?v=20260916-r53&id='+encodeURIComponent(r.groupId);const u=new URL(r.teacher?'teacher2026summer_vertical.html':'teacher2026summer.html',location.href);if(r.teacher)u.searchParams.set('teacher',r.teacher);u.searchParams.set('openKey',r.eventKey||'');return u.pathname.split('/').pop()+u.search}
function render(){const openConversations=new Set([...document.querySelectorAll('.record-conversation[open]')].map(el=>el.closest('.card').dataset.key));const back=document.querySelector('.wrap>a.ws-button');if(back)document.querySelector('.top-actions').prepend(back);const q=document.getElementById('q').value.trim().toLowerCase(),d=document.getElementById('date').value,t=document.getElementById('teacher').value;let a=records.filter(r=>RecordHistory.includes(r)&&(!targetClass||String(r.className||'').trim()===targetClass)&&(!t||r.teacher===t)&&(!q||[r.className,r.teacher,r.author,r.editedBy,r.updatedBy,r.memo,r.subject,r.room,(r.replies||[]).map(x=>x.text).join(' ')].join(' ').toLowerCase().includes(q)));a.sort(RecordHistory.sort);RecordHistory.update();document.getElementById('count').textContent=`${a.length}件`;document.getElementById('list').innerHTML=a.length?a.map(r=>{const reads=Object.keys(r.reads||{});const mine=viewerName()&&reads.includes(viewerName());const reps=Array.isArray(r.replies)?r.replies:[];return `<article class="card ${teacherTone(r.teacher)}" data-key="${esc(r.eventKey)}"><div class="meta"><span class="chip" data-record-date="${esc(r.date)}">📅 ${esc(KarteUI.dateLabel(r.date))}</span><span class="chip">🕒 ${esc(r.slot)}</span>${r.teacher?`<span class="chip record-teacher">👤 担当講師：${esc(r.teacher)}</span>`:''}${r.room?`<span class="chip">🏫 ${esc(r.room)}</span>`:''}</div><div class="record-heading"><button type="button" class="classLink" data-class="${esc(r.className||'授業')}">${esc(r.className||'授業')}</button></div>${recordByline(r)}<div class="record-content-label">授業カルテ</div><div class="memo ${teacherTone(r.teacher)}">${esc(r.memo)}</div>${String(r.homework||'').trim()?`<div class="homework"><strong>📚 次回までの宿題</strong>${esc(r.homework)}</div>`:''}<section class="record-attendance" data-attendance-key="${esc(r.eventKey)}">${KarteUI.attendanceHtml(attendanceByKey[r.eventKey])}</section><div class="editBox"><label style="font-weight:900">カルテ本文</label><textarea class="editMemo">${esc(r.memo)}</textarea><label class="editHomeworkLabel">📚 次回までの宿題</label><textarea class="editHomework" placeholder="宿題がない日は「宿題なし」と記入">${esc(r.homework||'')}</textarea><button type="button" class="ws-button" data-homework-none=".editHomework">宿題なしを入力</button><div class="editActions"><button type="button" class="editSaveBtn">保存</button><button type="button" class="editCancelBtn">キャンセル</button></div></div><div class="updated" data-record-time="${esc(r.updatedAt||'')}" data-record-time-label="更新：">更新：${esc(formatDateTime(r.updatedAt||''))}</div><details class="record-conversation"><summary>返信・やりとり <span>${reps.length}件</span></summary><div class="replies">${reps.map(x=>`<div class="reply"><span class="avatar ${teacherTone(x.author)}">👤</span><div class="bubble ${teacherTone(x.author)}"><b>${esc(x.author||'先生')}</b><p>${esc(x.text||'')}</p>${x.createdAt?`<span class="reply-time" data-record-time="${esc(x.createdAt)}" data-record-time-label="送信：">送信：${esc(formatDateTime(x.createdAt))}</span>`:''}${KarteUI.reactionsHtml(r,x)}</div></div>`).join('')||'<small>返信はまだありません。</small>'}</div><div class="replyForm"><input placeholder="このカルテに返信" class="replyInput"><button type="button" class="replyBtn">返信</button></div></details><div class="cardActions"><button type="button" class="editBtn">✏️ 編集</button><button type="button" class="readBtn ${mine?'done':''}">${mine?'✓ よみました':'👀 よみました'}</button><a class="detailBtn" href="${esc(detailUrl(r))}">授業詳細へ</a><span class="reads">既読：${reads.length?esc(reads.join('・')):'まだありません'}</span></div></article>`}).join(''):'<div class="empty">該当するカルテはありません。</div>';document.querySelectorAll('.card').forEach(card=>{if(openConversations.has(card.dataset.key))card.querySelector('.record-conversation').open=true;});}
async function api(body){const r=await fetch('lesson_record_api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error||'保存に失敗しました');return j}
async function readList(includeAttendance){const response=await fetch('lesson_record_api.php?includeTiming=1&'+(includeAttendance?'includeAttendance=1&':'')+'v='+Date.now(),{cache:'no-store'}),j=await response.json();if(!response.ok||!j.ok)throw new Error(j.error||'読み込みに失敗しました');return j}
function refreshReactionViews(card,record){card.querySelectorAll('[data-reaction-target]').forEach(host=>{const id=host.dataset.reactionTarget,reply=id?(record.replies||[]).find(r=>r.id===id):null;if(id&&!reply)return;host.outerHTML=KarteUI.reactionsHtml(record,reply);});}
document.getElementById('list').addEventListener('click',async e=>{
 const button=e.target.closest('[data-reaction]');if(!button)return;const card=button.closest('.card'),key=card.dataset.key,replyId=button.dataset.replyId,chosen=button.dataset.reaction,expected=button.dataset.expected;
 if(reactionPending.has(key))return;reactionPending.add(key);card.querySelectorAll('[data-reaction]').forEach(b=>b.disabled=true);
 const getHost=()=>[...card.querySelectorAll('[data-reaction-target]')].find(h=>h.dataset.reactionTarget===replyId);
 getHost().querySelector('.karte-reaction-message').textContent='保存中…';let text='';
 try{const j=await api({action:'reaction',eventKey:key,replyId,emoji:expected===chosen?'':chosen,expected});const i=records.findIndex(r=>r.eventKey===key);if(i>=0)records[i]=j.record;refreshReactionViews(card,j.record);text=expected===chosen?'取り消しました。':'リアクションしました。';}
 catch(err){text=err.message;try{const response=await fetch('lesson_record_api.php?key='+encodeURIComponent(key),{cache:'no-store'}),j=await response.json();if(response.ok&&j.ok&&j.record?.eventKey){const i=records.findIndex(r=>r.eventKey===key);if(i>=0)records[i]=j.record;refreshReactionViews(card,j.record);}}catch(_){} }
 finally{reactionPending.delete(key);card.querySelectorAll('[data-reaction]').forEach(b=>b.disabled=false);const host=getHost();if(host){host.querySelector('.karte-reaction-message').textContent=text;if(document.activeElement===document.body)[...host.querySelectorAll('[data-reaction]')].find(b=>b.dataset.reaction===chosen)?.focus({preventScroll:true});}}
});
window.addEventListener('pageshow',async e=>{if(!e.persisted)return;try{const j=await readList(true);attendanceByKey=j.attendance||{};document.querySelectorAll('[data-attendance-key]').forEach(el=>el.innerHTML=KarteUI.attendanceHtml(attendanceByKey[el.dataset.attendanceKey]));KarteUI.refreshDates();}catch(_){document.querySelectorAll('[data-attendance-key]').forEach(el=>el.innerHTML=KarteUI.attendanceHtml(null));}});
async function init(){try{const session=await window.StaffAuth.ready;teacherToneRules=Array.isArray(session.recordDisplay?.teacherToneRules)?session.recordDisplay.teacherToneRules:[];if(targetClass){document.getElementById('pageTitle').textContent='🗂 '+targetClass+' のカルテ一覧';document.getElementById('classFilterNotice').innerHTML='<div class="class-filter-notice"><span>授業：'+esc(targetClass)+' のカルテだけ表示中</span><a href="'+withViewer('lesson_records.html')+'">全授業を表示</a></div>';}let j;try{j=await readList(true);}catch(_){j=await readList(false);}records=Object.values(j.records||{});RecordHistory.setTimings(j.timings);RecordHistory.setRecords(records);attendanceByKey=j.attendance||{};const ts=[...new Set(records.map(r=>r.teacher).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));document.getElementById('teacher').innerHTML='<option value="">担当講師：すべて</option>'+ts.map(x=>`<option>${esc(x)}</option>`).join('');viewerEl.innerHTML='<option value="">先生名を選択</option>'+ts.map(x=>`<option>${esc(x)}</option>`).join('');const preset=(params.get('viewer')||localStorage.getItem('karteViewer')||'').trim();if(preset&&ts.includes(preset))viewerEl.value=preset;const teacherPreset=(params.get('teacher')||'').trim();if(ts.includes(teacherPreset))document.getElementById('teacher').value=teacherPreset;const datePreset=params.get('date')||'';if(/^\d{4}-\d{2}-\d{2}$/.test(datePreset))document.getElementById('date').value=datePreset;render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">読み込みに失敗しました。</div>'}}
['q','date','teacher'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render)); viewerEl.addEventListener('change',()=>{localStorage.setItem('karteViewer',viewerName());render()});
document.getElementById('list').addEventListener('click',async e=>{const card=e.target.closest('.card');if(!card)return;const key=card.dataset.key;if(e.target.closest('.classLink')){location.href=classUrl(e.target.closest('.classLink').dataset.class);return}if(e.target.closest('.editBtn')){card.classList.add('is-editing');const ta=card.querySelector('.editMemo');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}return}if(e.target.closest('.editCancelBtn')){card.classList.remove('is-editing');const r=records.find(x=>x.eventKey===key);const ta=card.querySelector('.editMemo');if(ta&&r)ta.value=r.memo||'';const hw=card.querySelector('.editHomework');if(hw&&r)hw.value=r.homework||'';return}if(e.target.closest('.editSaveBtn')){const ta=card.querySelector('.editMemo');const memo=(ta?.value||'').trim();if(!memo)return alert('カルテ本文を空欄にはできません。');const homework=card.querySelector('.editHomework')?.value||'';const btn=e.target.closest('.editSaveBtn');btn.disabled=true;btn.textContent='保存中…';try{const j=await api({action:'edit',eventKey:key,memo,homework});const i=records.findIndex(x=>x.eventKey===key);if(i>=0)records[i]=j.record;render()}catch(err){alert(err.message);btn.disabled=false;btn.textContent='保存'}return}if(e.target.closest('.readBtn')){if(!viewerName())return alert('先生のアカウントでログインし直してください。');try{const j=await api({action:'read',eventKey:key,teacher:viewerName()});const i=records.findIndex(x=>x.eventKey===key);if(i>=0)records[i]=j.record;render()}catch(err){alert(err.message)}return}if(e.target.closest('.replyBtn')){if(!viewerName())return alert('先生のアカウントでログインし直してください。');const input=card.querySelector('.replyInput'),text=input.value.trim();if(!text)return;try{const j=await api({action:'reply',eventKey:key,author:viewerName(),text});const i=records.findIndex(x=>x.eventKey===key);if(i>=0)records[i]=j.record;render()}catch(err){alert(err.message)}}});
document.getElementById('backupBtn').addEventListener('click',async()=>{const b=document.getElementById('backupBtn'),m=document.getElementById('backupMsg');b.disabled=true;m.textContent='バックアップ作成中…';try{const j=await (await fetch('backup_api.php',{method:'POST'})).json();if(!j.ok)throw new Error(j.error||'失敗');m.innerHTML=j.url?('作成しました：<a href="'+esc(j.url)+'">'+esc(j.file)+' をダウンロード</a>'):('サーバー内に '+esc(j.snapshot||j.file)+' を作成しました。FTPで data/_system_backups/ から取得できます。');}catch(e){m.textContent=e.message}finally{b.disabled=false}});RecordHistory.install(render);init();
const readTab=document.getElementById('recordsReadTab'),tasksTab=document.getElementById('recordsTasksTab');
function recordView(tasks){document.getElementById('recordsReadPanel').hidden=tasks;document.getElementById('recordsTasksPanel').hidden=!tasks;readTab.setAttribute('aria-selected',String(!tasks));tasksTab.setAttribute('aria-selected',String(tasks));readTab.tabIndex=tasks?-1:0;tasksTab.tabIndex=tasks?0:-1;}
document.addEventListener('click',e=>{if(e.target.closest('#recordNoticeCount')){e.preventDefault();tasksTab.click();}});
readTab.onclick=()=>{history.replaceState(null,'',location.pathname+location.search+'#records');recordView(false);};tasksTab.onclick=()=>{history.replaceState(null,'',location.pathname+location.search+'#lessonTasks');recordView(true);};
for(const tab of [readTab,tasksTab])tab.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?readTab:e.key==='End'?tasksTab:tab===readTab?tasksTab:readTab;next.click();next.focus();};
window.addEventListener('hashchange',()=>recordView(location.hash==='#lessonTasks'));recordView(location.hash==='#lessonTasks');
if(params.get('teacher')||params.get('date'))document.querySelector('.records-filter').open=true;

</script></body></html>
