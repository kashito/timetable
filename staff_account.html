<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先生のアカウント</title><link rel="stylesheet" href="workspace-ui.css?v=20260912-r24"><script src="staff-auth.js?v=20260917-r56-ready" data-staff="required"></script><script defer src="workspace-ui.js?v=20260916-r54-ready"></script></head><body><main class="workspace-page"><h1>先生のアカウント</h1><p class="lede">自分のパスワードを変更できます。先生の登録・停止は管理者が行います。</p><section class="ws-panel"><h2>自分のパスワード</h2><form id="passwordForm" class="ws-form" style="max-width:450px"><label>現在のパスワード<input id="oldPassword" type="password" autocomplete="current-password" required></label><label>新しいパスワード（12文字以上）<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary">変更する</button><div id="passwordMsg" class="ws-message" role="status"></div></form></section><section id="accountsAdmin" class="ws-panel" hidden><h2>先生の登録・変更</h2><p class="ws-muted">仮パスワードでログインした先生は、自分のパスワードへ変更してから利用します。停止しても過去の記録は残ります。</p><p><button type="button" class="ws-button" id="createPreviewAccount">確認用の講師アカウントを作成</button></p><div id="previewAccountResult" class="ws-panel" hidden></div><div id="accountsList" class="ws-overflow"></div><form id="accountForm" class="ws-form" style="max-width:550px"><label>ログインID<input id="accountId" pattern="[a-zA-Z0-9_.-]{3,40}" required></label><label>先生名（時間割と同じ表記）<input id="accountName" list="accountTeacherNames" required><datalist id="accountTeacherNames"></datalist></label><label>権限<select id="accountRole"><option value="teacher">先生</option><option value="admin">管理者</option></select></label><label>仮パスワード（既存のままなら空欄）<input id="accountPassword" type="password" autocomplete="new-password" minlength="12"></label><label class="ws-check"><input type="checkbox" id="accountActive" checked>利用可能</label><button class="primary">保存する</button><div id="accountMsg" class="ws-message" role="status"></div></form></section></main><script defer src="staff-account.js?v=20260915-r50"></script></body></html>
