<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先生のログイン</title><link rel="stylesheet" href="workspace-ui.css?v=20260912-r24"><script src="staff-auth.js?v=20260917-r56-ready"></script></head><body style="background:#f0f5f8"><main class="workspace-page auth-card"><h1>先生のログイン</h1><p class="lede">発言・記録には、ログインした先生の名前が付きます。</p><form id="loginForm" class="ws-panel ws-form"><label>ログインID<input id="loginId" autocomplete="username" required></label><label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label><label id="setupLabel" hidden>初期設定キー<input id="setupKey" autocomplete="off"></label><p id="setupNote" class="ws-muted" hidden>最初に管理者アカウントを作成します。更新手順書の初期設定キーを入力し、IDと12文字以上のパスワードを決めてください。</p><button class="primary" id="loginButton">ログイン</button><div id="loginMessage" class="ws-message" role="status"></div></form><a href="student.html">生徒のスケジュールへ</a></main><script>
(()=>{const $=id=>document.getElementById(id);let setup=false;StaffAuth.ready.then(j=>{setup=j.needsSetup;$('setupLabel').hidden=$('setupNote').hidden=!setup;$('loginButton').textContent=setup?'管理者アカウントを作成':'ログイン';if(setup)$('loginPassword').minLength=12;});$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;try{const j=await StaffAuth.api({action:setup?'setup':'login',id:$('loginId').value.trim(),password:$('loginPassword').value,setupKey:$('setupKey').value.trim()});const home=j.user.role==='admin'?'schedule_generator.html':'teacher2026summer.html';const next=new URLSearchParams(location.search).get('next')||home;let safe=(/^[a-zA-Z0-9_-]+\.html(?:\?.*)?$/.test(next)||next==='codex_memos.php'||next==='system_updates.php'||next==='school_events.php'||/^incident_reports\.php(?:\?id=[a-f0-9]{24})?$/.test(next))?next:home;if(j.user.role!=='admin'&&(safe==='school_events.php'||/^(schedule_generator|class_manage|student_manage|payroll)\.html(?:\?|$)/.test(safe)))safe=home;location.replace(j.user.mustChange?'staff_account.html':safe);}catch(err){$('loginMessage').textContent=err.message;$('loginMessage').classList.add('error');}finally{$('loginButton').disabled=false;}};})();
</script></body></html>
